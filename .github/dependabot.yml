          - 'patch'

  # ────────────────────────────────────
  # Python — mcp-server-gladlabs (uv, private operator overlay)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server-gladlabs'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:20'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-gladlabs-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Python — mcp-server-voice (uv)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server-voice'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:25'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-voice-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Docker (base images)
  # ────────────────────────────────────
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'ci:'

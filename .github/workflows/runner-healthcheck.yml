# runner-healthcheck — self-healing control loop for the unit-tests
# self-hosted runner (docs/operations/self-hosted-ci-runner.md).
#
# WHY THIS IS HOSTED: it is the one workflow that must run in GitHub's cloud.
# A "is Matt's PC reachable?" probe cannot run on Matt's PC. It reconciles the
# `CI_RUNNER` repo variable against the live status of the self-hosted
# runners. The variable is read by every seam-safe job: the pytest-shaped
# ones plus the lint / scan / codegen jobs widened onto the seam so a
# GitHub-hosted outage degrades CI instead of blocking it outright.
#
# Do not enumerate the members here — this comment previously named four
# workflows and had already drifted from the real set. The authority is
# `grep -l 'vars.CI_RUNNER' .github/workflows/*.yml`, and
# `scripts/ci/ci_runner_seam_lint.py` enforces who may join.
#
# NEVER a job that needs the Docker daemon: the runner containers mount no
# docker.sock (they execute raw PR code), so anything with
# services:/container:/docker stays hosted — docker-build's build-worker sits
# behind its own dormant CI_RUNNER_DOCKER seam instead (see
# docker-compose.local.yml). That mistake has shipped twice (#2920, and
# benchmarks' `services: postgres` failing every night for weeks), which is
# why the lint exists.
#
#   >=1 self-hosted runner online  ->  set CI_RUNNER   (seam jobs run on the PC, $0 minutes)
#   none online                    ->  unset CI_RUNNER (seam jobs fall back to ubuntu-latest,
#                                                        so a PR's required check can't hang)
#                                   + force-cancel / re-run runs ALREADY queued for
#                                     self-hosted (their vars were fixed at creation,
#                                     so the unset alone never reaches them)
#
# Operator override via the `CI_RUNNER_MODE` repo variable:
#   auto (default / unset) = liveness-driven, as above (self-heal both directions)
#   on                     = force self-hosted (never auto-revert, even if probe can't see it)
#   off                    = force GitHub-hosted (the kill-switch: never auto-enable)
#
# COST: each run bills ~1 rounded-up hosted minute. The 6-hour cron is ~120
# min/month — a rounding artifact, not real work. Bump the cron for faster
# failover, drop it for fewer minutes. `workflow_dispatch` reconciles instantly
# (run it right after you start or stop the runners).
name: runner-healthcheck

on:
  schedule:
    # Every 6 hours. Failover latency <= 6h in `auto` mode; manual dispatch is
    # instant. Tune in docs/operations/self-hosted-ci-runner.md.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      recover_dry_run:
        description: "Only report stranded self-hosted runs; do not force-cancel / re-run them"
        type: boolean
        default: false

# The runner App's installation token (minted in the first step) carries the
# runner + variable privilege. The default GITHUB_TOKEN gets `actions: write`
# for one thing only: force-cancelling and re-running runs stranded on dead
# runners (the "Recover stranded runs" step). The runner App deliberately does
# not hold Actions — widening a dedicated App is worse than using the token
# the workflow already has.
permissions:
  contents: read
  actions: write

concurrency:
  group: runner-healthcheck
  cancel-in-progress: false

jobs:
  reconcile:
    # Never run on the public mirror (Glad-Labs/poindexter): it has no
    # self-hosted runner and no admin PAT, and its unit-tests seam is always
    # ubuntu-latest by construction. The job no-ops there.
    if: github.repository == 'Glad-Labs/glad-labs-stack'
    runs-on: ubuntu-latest
    # 10, not 5: the stranded-run recovery waits for force-cancelled runs to
    # reach `completed` (up to 3 min) before re-running them.
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      RUNNER_LABELS: '["self-hosted","linux","x64"]'
      DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
      # Surfaced as an env var because the `secrets` context is NOT allowed in a
      # step `if:` — GitHub rejects `if: secrets.x != ''` at parse time ("Unrecognized
      # named-value: 'secrets'"). The `env` context IS allowed in `if:`, so the
      # dormant guard below keys on this instead. (Job-level env referencing a
      # secret is the documented workaround.)
      RUNNER_APP_ID: ${{ secrets.CI_RUNNER_APP_ID }}
    steps:
      # Mint a short-lived (1h) installation token from the dedicated runner App.
      # The token carries the FULL set of permissions the App install was granted
      # — and that set is already exactly minimal: this App is dedicated to the
      # runner and holds only Administration (list runners) + Variables (flip
      # CI_RUNNER) + Metadata. So minting the full token IS least-privilege; the
      # App install itself is the privilege boundary, not a per-mint narrowing.
      #
      # We do NOT pass `permission-*` inputs to narrow further. Two reasons:
      #   1. `create-github-app-token` has no `permission-variables` input — the
      #      repo-variables permission key is `actions_variables`, so the input
      #      was silently ignored (a build warning), never granting Variables.
      #   2. Narrowing to a subset the install wasn't granted 422s ("permissions
      #      requested are not granted to this installation").
      # Net: the narrowing was both wrong and unnecessary. Drop it.
      #
      # Guarded on the App-ID secret so this whole workflow is a quiet green no-op
      # until the runner feature is configured. Pinned to a SHA per the
      # third-party-Actions lint.
      - name: Mint runner-App installation token
        id: app-token
        if: ${{ env.RUNNER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_RUNNER_APP_ID }}
          private-key: ${{ secrets.CI_RUNNER_APP_PRIVATE_KEY }}

      - name: Reconcile CI_RUNNER against live runner status
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Dormant until the runner App is configured (no token minted). A green
          # skip (not a red failure) keeps the scheduled run quiet before setup.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::CI_RUNNER_APP_ID not set — self-hosted runner not configured yet; nothing to reconcile."
            echo "self-hosted runner not configured (no runner App)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # On a 404 (an unset variable) `gh api` writes the JSON error body to
          # STDOUT and exits non-zero, so the naive `… 2>/dev/null || echo ''`
          # form leaks that body into the value instead of returning ''. Capture
          # first, then reset to '' on any non-2xx. Without this an unset CI_RUNNER
          # reads as non-empty, and the auto-ENABLE half of the loop never fires
          # (`[ -z "$current" ]` stays false) — failover recovery would be dead.
          read_var() {
            local v
            v="$(gh api "/repos/$REPO/actions/variables/$1" --jq .value 2>/dev/null)" || v=''
            printf '%s' "$v"
          }

          mode="$(read_var CI_RUNNER_MODE)"; mode="${mode:-auto}"
          current="$(read_var CI_RUNNER)"
          # A failed probe reads as 0 for the reconcile (failing over is the
          # safe side of an API error) but clears `probe_ok`: the stranded-run
          # recovery below force-cancels runs, so it acts only on a zero the
          # API actually reported.
          probe_online() {
            gh api "/repos/$REPO/actions/runners" \
              --jq '[.runners[] | select(.status=="online")] | length' 2>/dev/null
          }
          probe_ok=1
          online="$(probe_online)" || { online=0; probe_ok=0; }

          # Guard against a transient blip (container restart after a stack
          # update): if we see zero, wait briefly and re-sample once before
          # deciding to revert.
          if [ "$online" -eq 0 ]; then
            sleep 30
            probe_ok=1
            online="$(probe_online)" || { online=0; probe_ok=0; }
          fi
          echo "mode=$mode  online_runners=$online  probe_ok=$probe_ok  CI_RUNNER='${current}'"

          case "$mode" in
            on)  desired="set"   ;;
            off) desired="unset" ;;
            *)   if [ "$online" -ge 1 ]; then desired="set"; else desired="unset"; fi ;;
          esac

          change="none"
          if [ "$desired" = "set" ] && [ -z "$current" ]; then
            gh variable set CI_RUNNER --repo "$REPO" --body "$RUNNER_LABELS"
            change="ENABLED — unit-tests → self-hosted"
          elif [ "$desired" = "unset" ] && [ -n "$current" ]; then
            gh variable delete CI_RUNNER --repo "$REPO"
            change="REVERTED — unit-tests → ubuntu-latest"
          fi

          echo "result: $change"

          # Read by the stranded-run recovery below. It acts only when the
          # seam now points at ubuntu-latest AND nothing self-hosted is alive —
          # with a runner online a queued job just gets picked up, and with
          # CI_RUNNER still set a re-run would queue on the dead label again.
          recover=false
          if [ "$desired" = "unset" ] && [ "$online" -eq 0 ]; then
            if [ "$probe_ok" = 1 ]; then
              recover=true
            else
              echo "::warning::runner probe failed — skipping stranded-run recovery, which force-cancels runs and so needs a confirmed zero."
            fi
          fi
          echo "recover=$recover" >> "$GITHUB_OUTPUT"
          {
            echo "### runner-healthcheck"
            echo "- mode: \`$mode\`"
            echo "- online self-hosted runners: **$online**$([ "$probe_ok" = 1 ] || echo ' (probe failed)')"
            echo "- action: **$change**"
            echo "- stranded-run recovery: **$recover**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Routine ops ping on a state change only (Discord, not Telegram —
          # this is graceful failover, not an outage). No-op if unconfigured.
          if [ "$change" != "none" ] && [ -n "${DISCORD_OPS_WEBHOOK_URL:-}" ]; then
            payload="$(printf '{"content":"⚙️ CI runner auto-flip: %s (mode=%s, online=%s)"}' "$change" "$mode" "$online")"
            curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_OPS_WEBHOOK_URL" >/dev/null || true
          fi

      # Unsetting CI_RUNNER only fails over runs created AFTER the flip: a
      # run's `vars` context is fixed at creation, so jobs already queued for
      # `[self-hosted, linux, x64]` wait forever for a runner that is gone.
      # PR #4102 (2026-09-27) sat Queued 15+ hours that way, and its stuck
      # `if: always()` gates held the `cancel-in-progress` concurrency groups
      # of benchmarks / cloudflare-workers / docker-build / security, so new
      # pushes queued behind it too. The script force-cancels each stranded
      # run (plain cancel does not clear an `always()` job) and re-runs its
      # failed/cancelled jobs, which re-read vars and land on ubuntu-latest —
      # unless a newer run of the same workflow + branch exists (a re-run would
      # rejoin the cancel-in-progress group and cancel the PR's current head
      # run) or it hit the attempt cap. Rationale in the script's docstring.
      - name: Check out the recovery script
        if: ${{ steps.reconcile.outputs.recover == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          sparse-checkout: scripts/ci/recover_stranded_runs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Recover runs stranded on dead self-hosted runners
        id: recover
        if: ${{ steps.reconcile.outputs.recover == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.recover_dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # DRY_RUN is empty or one flag
          python3 scripts/ci/recover_stranded_runs.py --repo "$REPO" $DRY_RUN

      - name: Report recovered runs
        # !cancelled(): a partial recovery exits 1 but may still have acted.
        if: ${{ !cancelled() && (fromJSON(steps.recover.outputs.recovered || '0') > 0 || fromJSON(steps.recover.outputs.cancelled || '0') > 0) }}
        shell: bash
        env:
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          CANCELLED: ${{ steps.recover.outputs.cancelled }}
        run: |
          if [ -n "${DISCORD_OPS_WEBHOOK_URL:-}" ]; then
            payload="$(printf '{"content":"⚙️ CI runner failover: re-ran %s run(s) stranded on offline self-hosted runners (now on ubuntu-latest); cancelled %s superseded or looping run(s) without a re-run"}' "$RECOVERED" "$CANCELLED")"
            curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_OPS_WEBHOOK_URL" >/dev/null || true
          fi

      # Ghost registrations accumulate because each runner container WIPES its
      # /actions-runner/.runner on every start and re-registers under a fresh
      # random name (RUNNER_NAME_PREFIX + suffix — see the entrypoint rationale
      # in docker-compose.local.yml). That self-heals a corrupt-config crash
      # loop, but the cost is one permanently-offline registration per container
      # start; 22 had piled up by 2026-07-26. They're functionally harmless (the
      # reconcile above counts only status=="online"), but they bury the live
      # runners in `gh api .../actions/runners` and in the repo's runner settings
      # page, which is exactly where you look first when CI is stuck "Queued".
      #
      # Deleting an offline registration is safe BY CONSTRUCTION here: names are
      # never reused, so an offline row can never come back to life — the
      # container that owned it will register a new name next start. No grace
      # period is needed for the same reason.
      #
      # Runs AFTER the reconcile so a prune failure can never break failover,
      # and warns rather than failing the job for the same reason: a red
      # housekeeping step on a workflow whose real job is keeping a required
      # check unblocked is worse noise than the ghosts.
      - name: Prune offline runner registrations
        # !cancelled(): a failed recovery above must not skip housekeeping.
        if: ${{ !cancelled() && env.RUNNER_APP_ID != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no runner App token — nothing to prune."
            exit 0
          fi

          # id<TAB>name, offline only. `|| true` on the read so a transient API
          # error yields an empty list (prune nothing) instead of a red job.
          stale="$(gh api "/repos/$REPO/actions/runners" --paginate \
            --jq '.runners[] | select(.status=="offline") | "\(.id)\t\(.name)"' 2>/dev/null || true)"

          if [ -z "$stale" ]; then
            echo "no offline registrations to prune"
            echo "- offline registrations pruned: **0**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pruned=0
          failed=0
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "/repos/$REPO/actions/runners/$id" >/dev/null 2>&1; then
              echo "pruned $name (id=$id)"
              pruned=$((pruned + 1))
            else
              echo "::warning::failed to prune runner $name (id=$id)"
              failed=$((failed + 1))
            fi
          done <<< "$stale"

          summary="- offline registrations pruned: **$pruned**"
          if [ "$failed" -gt 0 ]; then
            summary="$summary (failed: $failed)"
            echo "::warning::$failed offline registration(s) could not be deleted — check the runner App still has Administration: read+write."
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

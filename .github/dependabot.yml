version: 2

updates:
  # ────────────────────────────────────
  # GitHub Actions (workflows)
  # ────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # npm (Node.js packages — root workspace)
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    # Held majors (2026-07-28). Both are major-ONLY holds — patches and minors
    # still flow, so security fixes are unaffected.
    #
    # typescript: held on an UPSTREAM blocker, not on our own code. The
    #   migration was attempted end-to-end on 2026-07-28 and is documented
    #   below so the next attempt is short.
    #
    #   BLOCKER — typescript-eslint does not support TS 7. Its parser refuses
    #   to load ("typescript-eslint does not support TS 7.0") and the latest
    #   published @typescript-eslint/parser still declares
    #   `typescript: >=4.8.4 <6.1.0`. Support is tracked upstream in
    #   typescript-eslint#10940 and targets TS >= 7.1. This is not cosmetic:
    #   eslint runs in lint-staged on EVERY commit touching .ts/.tsx, so
    #   adopting TS 7 today breaks the local commit loop for all work.
    #   Re-check that peer range; when it admits 7.x, do the steps below.
    #
    #   Everything else already works. TS 7 is the native (Go) compiler
    #   rewrite, and the production source needed ZERO changes — `tsc
    #   --noEmit` was clean, `next build` completed with full static
    #   generation, and jest was 332/332. Three mechanical changes are needed:
    #
    #     1. experimental.useTypeScriptCli: true in web/public-site and
    #        web/storefront next.config.js. TS 7 dropped the JS compiler API
    #        Next calls in-process; without this Next fails outright. Next's
    #        own error names this flag as the supported path.
    #     2. Remove `baseUrl` from web/public-site/tsconfig.json — TS 7
    #        removed the option (error TS5102). `paths` keeps working; with no
    #        baseUrl it resolves relative to the tsconfig's own directory,
    #        which is what "." meant here anyway.
    #     3. Exclude test globs from that tsconfig. useTypeScriptCli runs the
    #        real `tsc -p`, which checks a WIDER file set than the old
    #        in-process path — it picks up test files that were never
    #        type-checked before (@types/jest has never been a dependency of
    #        this repo). Excluding them restores the previous behaviour rather
    #        than loosening anything.
    #
    #   Also worth knowing: typescript was NOT the only thing failing
    #   jest-unit and Playwright back when this hold was added, despite how it
    #   looked. react/react-dom 19.2.8 and @tailwindcss/postcss 4.3.3 broke
    #   them independently via a workspace hoisting bug, fixed in #2886.
    #
    # @types/node: the 22 -> 26 major already landed outside dependabot, so all
    #   four manifests are on ^26.1.x today. This entry is a forward guard
    #   against an unattended 27 rather than a fix for anything open now.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Group updates by type for easier review. Restricted to minor/patch
    # (matching every other grouped ecosystem below) so a major bump rides
    # alone in its own PR instead of blocking a batch of safe updates.
    groups:
      development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # npm — web/starter (Next.js template)
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/web/starter'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:35'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      web-starter-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # npm — Cloudflare Workers page-views beacon
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/infrastructure/cloudflare/page-views-beacon'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:40'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      beacon-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Python — src/cofounder_agent (pip / Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/src/cofounder_agent'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — brain daemon (Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/brain'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:05'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — root pyproject.toml (Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:10'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — mcp-server (uv)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:15'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-minor-patch:

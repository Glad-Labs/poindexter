# Lint every Grafana panel query against a real datasource. Catches the
# class of bug that PR #308 cleaned up (4 panels referencing
# renamed/dropped tables/columns — silently broken until an operator
# opened the dashboard). Runs:
#
#   1. Apply migrations against an empty Postgres 16 + pgvector container
#      (so schema-drift checks have a real schema to validate against).
#   2. Boot a vanilla Prometheus container (PromQL parser only — we don't
#      care about scraped data).
#   3. Run scripts/ci/grafana_panels_lint.py — fails the build on
#      Postgres 42703/42P01 or PromQL parse errors.
#
# Loki is NOT exercised in CI (booting a Loki stack just for parse-level
# validation isn't worth it). The lint script falls back to SKIP for loki
# targets when LOKI_URL is unset.
name: grafana-panels-lint

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/grafana/**'
      - 'scripts/ci/grafana_panels_lint.py'
      - 'scripts/ci/grafana_threshold_ramp_lint.py'
      - 'src/cofounder_agent/services/migrations/**'
      - '.github/workflows/grafana-panels-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/grafana/**'
      - 'scripts/ci/grafana_panels_lint.py'
      - 'scripts/ci/grafana_threshold_ramp_lint.py'
      - 'src/cofounder_agent/services/migrations/**'
      - '.github/workflows/grafana-panels-lint.yml'
  workflow_dispatch:

# Cancel older in-progress runs of the same ref/PR — saves Actions minutes
# when multiple commits land back-to-back on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN — read-only checkout is all this workflow
# needs. Bump per-job if a step ever needs write access (none does today).
permissions:
  contents: read

jobs:
  grafana-panels-lint:
    # Source-repo only — same rationale as integration-db.yml. The mirror is
    # force-pushed (checks gate nothing) and this isn't a required check there;
    # it would re-validate the same (public) dashboards the source already
    # linted against the same migrations. Skip on poindexter, run on the source.
    if: github.repository != 'Glad-Labs/poindexter'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poindexter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poindexter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      prometheus:
        # Vanilla prometheus is enough — we only hit /api/v1/query for
        # PromQL parse validation. Use the official image with no custom
        # config (it'll log scrape errors which we ignore).
        image: prom/prometheus:v2.54.1
        ports:
          - 9090:9090

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/poindexter_test
      PROMETHEUS_URL: http://localhost:9090

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      # Same minimal-deps approach as migrations-smoke. asyncpg + httpx
      # are the only runtime deps the lint actually uses.
      - name: Install runtime deps
        run: pip install "asyncpg>=0.30,<0.32" "httpx>=0.28,<0.29"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            echo "waiting for postgres... ($i)"
            sleep 1
          done
          echo "postgres never became ready" >&2
          exit 1

      - name: Wait for Prometheus
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/-/ready > /dev/null 2>&1; then
              echo "prometheus ready"
              exit 0
            fi
            echo "waiting for prometheus... ($i)"
            sleep 1
          done
          echo "prometheus never became ready" >&2
          exit 1

      # Apply the project migrations so schema-drift checks
      # (UndefinedColumn, UndefinedTable) have something to validate
      # against. Reuses the same script the migrations-smoke job runs.
      - name: Apply migrations
        run: python scripts/ci/migrations_smoke.py

      # Hard-fail. This step was `continue-on-error: true` from the time the
      # macro expansion mis-rendered $__timeFrom()/$__timeTo() as bigint-ms
      # (Grafana's Postgres datasource emits quoted timestamp literals), which
      # made correct SQL report `42846 cannot cast type bigint to timestamp`
      # and false-failed 58 panels. That was fixed 2026-08-07; the soft-fail
      # outlived it by three weeks, during which a genuinely broken panel
      # query would have merged green -- exactly the #308 bug class this
      # workflow exists to catch. Restored to hard-fail 2026-08-28
      # (poindexter#1029) on the evidence of 0 warnings / 0 failures in CI and
      # against live datasources, and 15/15 clean runs of the service
      # containers (their wait steps were never soft-failed, so those
      # successes are real).
      #
      # NOTE: this job carries a `paths:` filter, so it must NOT be added to
      # the branch's required status checks -- a required check that is
      # path-filtered never reports on PRs outside those paths and leaves them
      # pending forever. A red X here is a visible signal to fix, not a merge
      # block.
      - name: Lint Grafana panel queries
        run: python scripts/ci/grafana_panels_lint.py infrastructure/grafana/dashboards/

  # Pure JSON structure check -- no datasource, no containers, so it runs as
  # its own fast job rather than queueing behind Postgres/Prometheus boot.
  # Unlike the query lint above this is a HARD gate: a duplicated threshold
  # colour has no false-positive mode, it is always either a missing
  # escalation colour or a step that should not exist.
  grafana-threshold-ramp-lint:
    # Source-repo only, same rationale as the job above.
    if: github.repository != 'Glad-Labs/poindexter'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      # Stdlib only -- no pip install step needed.
      - name: Lint Grafana threshold ramps
        run: python scripts/ci/grafana_threshold_ramp_lint.py infrastructure/grafana/dashboards/

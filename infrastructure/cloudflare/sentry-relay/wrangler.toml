name = "sentry-relay"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Rate limiting — 120 requests/min per IP. Error capture is burstier than page
# views (a broken deploy fires many events fast), so this is more generous than
# the page-views beacon's 60/min while still killing a sustained abuse loop.
# The namespace_id is a per-worker integer you pick; the CF dashboard shows it
# under Workers > Rate Limiting after the first deploy.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

# Operator config — ALL of it lives as Worker SECRETS, none as [vars]
# (set each after the first deploy):
#
#   echo "https://example.com,https://www.example.com" | npx wrangler secret put ALLOWED_ORIGINS
#   echo "1" | npx wrangler secret put ALLOWED_PROJECT_IDS
#   echo "https://<host>.<tailnet>.ts.net" | npx wrangler secret put GLITCHTIP_INGEST_ORIGIN
#
# Secrets survive `wrangler deploy`; plain-text vars do not — deploys are
# declarative about [vars], so a dashboard-set var is wiped on the next
# deploy and a committed var clobbers a same-named secret. (The
# page-views-beacon ran with origin enforcement silently off until
# 2026-08-31 for exactly this reason.)
#
# ALLOWED_ORIGINS — comma-separated public-site origins checked against the
#   browser Origin header. Unset disables the check: dev only, MUST be set
#   in production.
# ALLOWED_PROJECT_IDS — comma-separated GlitchTip project ids the relay
#   forwards (the open-proxy guard). Unset = fail closed: forwards nothing.
# GLITCHTIP_INGEST_ORIGIN — path-scoped Tailscale Funnel base URL fronting
#   GlitchTip's ingest, e.g. "https://<host>.<tailnet>.ts.net". A secret
#   also for privacy: the operator's tailnet hostname never lands in this
#   repo or in browser source. The Worker forwards envelopes to
#   ${GLITCHTIP_INGEST_ORIGIN}/api/<project_id>/envelope/.

# Custom domain — route your own subdomain (e.g. sentry-relay.example.com) to
# this Worker via the CF dashboard or `wrangler routes add`. Don't commit a
# route block with an operator-specific hostname (feedback_no_operator_info_to_public_repo).

# systemd-oomd swap-based kill — added 2026-08-27 after the hard-reboot freeze.
#
# WHY THIS EXISTS: on 2026-08-27 the box livelocked with ~28 GiB of swap held
# by four DORMANT model sidecars (chatterbox 8.9G, wan-server 7.6G, speaches
# 7.4G, stable-audio 3.9G) while MemAvailable still read ~20 GiB. The kernel
# OOM killer therefore never fired — there was no allocation failure, just
# infinite direct reclaim against a 100%-full swap device. Nothing broke the
# loop and the machine needed a hard power cycle.
#
# WHY NOT earlyoom: earlyoom triggers only when free RAM *and* free swap are
# both under threshold (an AND). This incident had 20 GiB free RAM and 0 GiB
# free swap, so earlyoom would not have fired. systemd-oomd's swap path keys
# on swap fullness ALONE, which is exactly the failure mode.
#
# system.slice is the right scope: all 46 poindexter containers are individual
# docker-<id>.scope units under it, and ollama-{primary,vision}.service live
# here too — so each is a separate kill candidate rather than one blob.
#
# CAVEAT: systemd-oomd selects by cgroup swap usage and IGNORES oom_score_adj,
# so the 2026-08-24 oom_score_adj tuning (postgres -500, sidecars +400) does
# NOT steer it. That tuning still governs the kernel OOM killer. In practice
# the sidecars outweigh postgres by 20-60x at the moment oomd acts.
[Slice]
ManagedOOMSwap=kill

      day: 'monday'
      time: '04:20'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-gladlabs-minor-patch:

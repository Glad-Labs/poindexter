# Publish the `poindexter` CLI to PyPI.
#
# Trigger: pushing a release tag (`v*.*.*`, as cut by release-please on the stack
# and mirrored here by release-mirror-to-public.yml), or a manual dispatch with
# `target` (testpypi | pypi). The package is always the one distribution built
# from src/cofounder_agent/pyproject.toml.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — there is NO API
# token stored in GitHub Secrets. To wire this up on first use:
#
#   1. Create the project on pypi.org (either by uploading a wheel
#      manually once, or by pre-registering via Trusted Publishers —
#      the "pending publisher" flow supports new projects).
#   2. Go to https://pypi.org/manage/account/publishing/ (or the
#      project's Publishing tab once it exists) and add a Trusted
#      Publisher with:
#        - Owner:         Glad-Labs
#        - Repository:    poindexter
#        - Workflow:      release-poindexter-to-pypi.yml
#        - Environment:   pypi
#   3. Repeat for https://test.pypi.org/ and environment `testpypi`
#      if you want to exercise the manual-dispatch path.
#
# No PYPI_API_TOKEN secret is used or required.
#
# History: Glad-Labs/poindexter#41 was closed 2026-04-21 on this workflow
# EXISTING. It had zero runs until 2026-08-28 (wrong tag trigger), and the
# first wheel it ever built could not import itself -- the CLI reached into the
# backend's flat `services`/`plugins`/`modules` packages, which a wheel could not
# ship. Glad-Labs/poindexter#1046 namespaced the backend under `poindexter.*`
# and made src/cofounder_agent/pyproject.toml the one distribution; the first
# real release (0.136.0, 2026-09-11) superseded the 0.0.1 name-reservation
# placeholder, and the clean-install smoke job below is what keeps a wheel that
# cannot run from ever reaching PyPI.

name: Release poindexter to PyPI

on:
  push:
    tags:
      # This USED to be "poindexter-v*.*.*" on the theory that the umbrella
      # repo would cut package-scoped tags. It never did: release-please runs
      # `include-component-in-tag: false`, so it cuts plain `v0.129.0`, and no
      # `poindexter-v*` tag has ever existed in either repo. The workflow
      # therefore had ZERO runs in its entire life and could not fire from the
      # release process at all -- while poindexter#41 ("Publish poindexter CLI
      # to PyPI") was closed 2026-04-21 on the workflow EXISTING. pypi.org
      # still 404s for the package. Found by the poindexter#1029 follow-on
      # audit. Matched to the tags actually cut so the build at least runs.
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (testpypi for a dry run, pypi for real)."
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  # Required for PyPI Trusted Publishing via OIDC.
  id-token: write
  # Needed so the action can read the tag/ref.
  contents: read

concurrency:
  group: release-poindexter-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Select package source
        id: src
        run: |
          # One distribution since Glad-Labs/poindexter#1046 step 5.
          dir="src/cofounder_agent"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "building from $dir"

      - name: Build distributions
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          python -m build
          ls -la dist/

      - name: Validate distributions
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          python -m twine check dist/*

      - name: Report package version
        id: pkg
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          # Extract version from the built sdist filename:
          #   poindexter-0.9.0.tar.gz -> 0.9.0
          wheel_file=$(ls dist/poindexter-*.whl | head -n1)
          version=$(basename "$wheel_file" | sed -E 's/^poindexter-([^-]+)-.*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built poindexter $version"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.6.2 as of 2026-05-12
        with:
          name: poindexter-dist
          path: ${{ steps.src.outputs.dir }}/dist/
          if-no-files-found: error
          retention-days: 14

  # The gate `twine check` cannot be. twine validates metadata and README
  # rendering and never imports the package -- before Glad-Labs/poindexter#1046
  # the real wheel PASSED it while `poindexter --help` died on `No module named
  # 'services'`, because the CLI imported flat roots the wheel did not ship.
  # This installs the wheel into a clean venv, runs the command, imports
  # `poindexter.services` + `poindexter.brain`, and fails if any retired flat
  # root (`services`, `plugins`, ...) is installed or importable -- the only
  # test that reflects what a user gets. Both publish jobs `needs` this one; a
  # green run on a `v*` tag build is the go-live signal for the real package.
  smoke:
    name: Clean-install smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.3.0 as of 2026-05-12
        with:
          name: poindexter-dist
          path: dist/

      - name: Install the wheel into a clean venv and run the CLI
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          echo "--- poindexter --help ---"
          "$RUNNER_TEMP/smoke/bin/poindexter" --help
          echo "--- import root: poindexter.* works, the retired flat roots do not ---"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import importlib, importlib.machinery, sysconfig
          from pathlib import Path
          importlib.import_module("poindexter.services")
          importlib.import_module("poindexter.brain.bootstrap")
          retired = ["services", "plugins", "modules", "utils", "routes", "schemas", "config", "tasks", "brain"]
          site = Path(sysconfig.get_paths()["purelib"])
          on_disk = [r for r in retired if (site / r).exists()]
          importable = [r for r in retired if importlib.machinery.PathFinder.find_spec(r) is not None]
          assert not on_disk and not importable, f"retired flat roots installed: disk={on_disk} importable={importable}"
          print("ok: only poindexter.* is installed;", len(list(site.glob("poindexter/*"))), "entries under poindexter/")
          PY

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, smoke]
    # Mirror-only for the same OIDC reason as publish-pypi below. This is the
    # dry run that proves the Trusted Publisher path before the real one is
    # switched on -- dispatch it from Glad-Labs/poindexter with target=testpypi.
    if: >-
      github.repository == 'Glad-Labs/poindexter' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/poindexter
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.3.0 as of 2026-05-12
        with:
          name: poindexter-dist
          path: dist/

      - name: Publish to TestPyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.0 / release/v1 as of 2026-05-12
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke]
    # Public and irreversible, so every path here is deliberate:
    #
    #  * Only from the PUBLIC mirror. The Trusted Publisher is registered
    #    against `Repository: poindexter`, and the mirror is where
    #    release-mirror-to-public.yml re-creates each `v*` tag. The same tag
    #    exists on glad-labs-stack, where the OIDC claim would not match.
    #  * `needs: smoke` -- nothing publishes that a clean install cannot run.
    #
    #  The switch: `vars.POINDEXTER_PYPI_RELEASE == 'true'` on Glad-Labs/poindexter,
    #  plus a release tag or a target=pypi dispatch. Set 2026-09-11 once the smoke
    #  job was green on the real package (Glad-Labs/poindexter#1046 step 7); every
    #  `v*` tag has published since. A target=pypi dispatch therefore PUBLISHES --
    #  use target=testpypi for a dry run.
    if: >-
      github.repository == 'Glad-Labs/poindexter' &&
      vars.POINDEXTER_PYPI_RELEASE == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/poindexter
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4.3.0 as of 2026-05-12
        with:
          name: poindexter-dist
          path: dist/

      - name: Publish to PyPI (OIDC Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.0 / release/v1 as of 2026-05-12
        with:
          packages-dir: dist/
          # skip-existing guards against re-runs trying to upload an
          # already-published version; intentional re-uploads should
          # bump the version number first.
          skip-existing: true

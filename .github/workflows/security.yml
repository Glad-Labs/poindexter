name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly baseline scan catches CVEs that appear in deps between PRs.
  schedule:
    - cron: '17 6 * * 1'
  # Manual trigger — useful after re-enabling the workflow (2026-05-12,
  # poindexter#403) or to force a re-scan after a credential rotation /
  # CVE patch without waiting for the next push.
  workflow_dispatch:

# Cancel older in-progress runs of the same ref/PR — saves Actions minutes
# when multiple commits land back-to-back on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  # Path-classifier (Glad-Labs/glad-labs-stack CI-minutes sweep). The four
  # file-specific lint jobs below (trivy-config / action-pins /
  # shell-line-endings / poetry-lock) only need to run when their inputs
  # change — gating them on this output skips up to 4 of the 7 jobs on a
  # typical backend-only PR (each job otherwise bills a rounded-up minute
  # of runner spin-up). Security is NOT a branch-protection-required check,
  # so a skipped job blocks nothing.
  #
  # gitleaks stays UNGATED — a secret can land in any file, so it always runs.
  # trivy-fs is gated on `deps == 'true'` — CVE scans only matter when dep
  # lockfiles change. On the weekly baseline scan and manual dispatch every job
  # runs regardless (the `|| schedule || workflow_dispatch` escape), so the
  # comprehensive drift-check is never narrowed by path classification.
  # sbom+grype runs on schedule/dispatch ONLY — it is entirely redundant with
  # trivy-fs on per-PR/push runs and is the most expensive job (~3–5 min).
  # CI-minutes sweep 2026-06-10.
  #
  # That weekly baseline is the only place main's own backlog surfaces, and it
  # reports to nobody by default — see the notify-baseline job at the bottom,
  # which pings Discord when it goes red.
  changes:
    name: classify changed paths
    # CI_RUNNER seam (see docs/operations/self-hosted-ci-runner.md): runs on the
    # self-hosted fleet when the repo variable is set, else ubuntu-latest. The
    # variable is unset on the public mirror and on forks, so this is hosted
    # there by construction. Seam-safe: no services:/container:/docker.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      workflows: ${{ steps.classify.outputs.workflows }}
      shell: ${{ steps.classify.outputs.shell }}
      pylock: ${{ steps.classify.outputs.pylock }}
      docker: ${{ steps.classify.outputs.docker }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          # >=2 so `git diff` against the parent works on push; PRs use the
          # virtual merge commit's HEAD^1 (current main's tip).
          fetch-depth: 2
      # Pure git-diff path classifier — NO third-party action on purpose.
      # This repo's Actions allowlist permits only github-owned + verified-
      # creator actions plus an explicit pattern list (see
      # docs/operations/ci-deploy-chain.md), so dorny/paths-filter etc. fail
      # at startup. Mirrors the detect-changes step in unit-tests.yml.
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          # Resolve the diff base. PR events check out a virtual merge commit
          # (HEAD^1 = main's tip); push events diff against the parent.
          if [ "$EVENT" = "pull_request" ]; then
            if git cat-file -e "HEAD^1" 2>/dev/null; then
              base="$(git rev-parse HEAD^1)"
            else
              base="${PR_BASE:-}"
            fi
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          # Fetch the base if the shallow checkout didn't include it.
          if [ -n "${base:-}" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi

          if [ -n "${base:-}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD)"
          else
            # Unknown base (initial push / fetch failure) — fail OPEN: treat
            # everything as changed so no scan is silently skipped.
            changed="$(git ls-files)"
          fi
          echo "Changed files vs ${base:-<none>}:"
          echo "$changed" | sed 's/^/  /'

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  -> $1=$2"; }
          # A broad match here only ever over-runs a scan (safe); the risk to
          # avoid is under-running, so patterns lean inclusive.
          if echo "$changed" | grep -qE '^\.github/workflows/'; then emit workflows true; else emit workflows false; fi
          if echo "$changed" | grep -qE '\.(sh|bash|ps1|psm1|psd1)$'; then emit shell true; else emit shell false; fi
          if echo "$changed" | grep -qE '^src/cofounder_agent/(pyproject\.toml|poetry\.lock)$'; then emit pylock true; else emit pylock false; fi
          if echo "$changed" | grep -qiE 'dockerfile|docker-compose|(^|/)compose\.ya?ml$|^infrastructure/'; then emit docker true; else emit docker false; fi
          # deps: fires when Python or JS lockfiles/manifests change. Used to
          # gate trivy-fs (CVE scan only matters when deps actually change).
          if echo "$changed" | grep -qE \
            '^src/cofounder_agent/(pyproject\.toml|poetry\.lock)$|^package(-lock)?\.json$|^web/'; \
            then emit deps true; else emit deps false; fi

  gitleaks:
    name: gitleaks — secret scan
    # CI_RUNNER seam (see docs/operations/self-hosted-ci-runner.md): runs on the
    # self-hosted fleet when the repo variable is set, else ubuntu-latest. The
    # variable is unset on the public mirror and on forks, so this is hosted
    # there by construction. Seam-safe: no services:/container:/docker.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        # No fetch-depth: 0 — we scan with --no-git so git history isn't
        # needed and a shallow checkout is enough.
      # Use the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2,
      # which requires a paid org license. Mirrors the same scan logic across
      # both the private (glad-labs-stack) repo and the public (poindexter)
      # mirror.
      #
      # --no-git: scan the working tree, not git history. This makes the
      # baseline fingerprints (file:rule:line) stable across commits.
      # Scanning history was the previous mode and produced 433+ findings
      # because every commit-shift created new fingerprints — the baseline
      # couldn't keep up, and the gate failed every push.
      #
      # The pre-commit hook (gitleaks 'protect --staged') still catches
      # secrets before they hit history, so history-mode isn't load-bearing.
      #
      # --baseline-path: every entry in .gitleaks-baseline.json is a triaged
      # known-OK match (curl/auth docstring examples, fixture-shaped strings,
      # rotated credentials embedded in remediation migrations). NEW findings
      # in the working tree still fail the build via --exit-code=1.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Run gitleaks
        run: |
          ./gitleaks detect \
            --no-git \
            --config=.gitleaks.toml \
            --source=. \
            --baseline-path=.gitleaks-baseline.json \
            --verbose \
            --redact \
            --exit-code=1

      # POSITIVE CONTROL. The scan above proves nothing was found; this proves
      # the scanner can still FIND. Every rule is a dated assertion about a
      # third party's credential format, and when a provider rotates that
      # format the regex does not fail -- it silently stops matching, and the
      # gate stays green forever. gitleaks' bundled `github-app-token` rule
      # went blind to stateless `ghs_<APPID>_<JWT>` tokens for four months
      # exactly this way (stack#3451).
      #
      # Runs on `always()` so a run that catches a real leak still reports a
      # blind rule -- the two failures are independent and you want both.
      # Reuses the binary downloaded above rather than re-fetching.
      - name: Positive control — secret-scan rules still fire
        if: always()
        run: GITLEAKS_BIN=./gitleaks python3 scripts/ci/gitleaks_canary.py

  trivy-fs:
    name: Trivy — filesystem vuln scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Gate on dep changes — CVE scans only matter when lockfiles/manifests change.
    # Weekly baseline + manual dispatch always run (drift check between PRs).
    if: ${{ needs.changes.outputs.deps == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
      - name: Trivy filesystem scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # venv / node_modules / build caches are reproducible from lockfiles
          # — skipping them keeps the scan fast and stops Trivy choking on
          # the Windows-bytecode cache pyc files in mcp-server/.venv.
          skip-dirs: '**/node_modules,**/.venv,**/__pycache__,**/.next,**/.vercel,**/dist,**/build,**/.pytest_cache,**/.claude'
          # The gitleaks baseline contains REDACTED+Match fields that look
          # like leaked secrets to a secret-scanner pattern matcher; it's
          # the documented record of known-clean findings, not a leak.
          skip-files: '.gitleaks-baseline.json'
      - name: Trivy filesystem scan (SARIF for code-scanning tab)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: '**/node_modules,**/.venv,**/__pycache__,**/.next,**/.vercel,**/dist,**/build,**/.pytest_cache,**/.claude'
          # The gitleaks baseline contains REDACTED+Match fields that look
          # like leaked secrets to a secret-scanner pattern matcher; it's
          # the documented record of known-clean findings, not a leak.
          skip-files: '.gitleaks-baseline.json'
      - name: Upload SARIF
        # GitHub Advanced Security is required to accept SARIF uploads on
        # private repos. glad-labs-stack doesn't have GHAS — the API
        # returns "Resource not accessible by integration". On the public
        # poindexter mirror, code-scanning is free, so uploads work there.
        # 2026-05-12 (poindexter#404) — added the repo guard to silence
        # the dead-end upload on private.
        if: always() && github.repository == 'Glad-Labs/poindexter'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3.35.4 as of 2026-05-12
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-config:
    name: Trivy — Dockerfile + IaC config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # Only when Dockerfiles / compose / IaC change (or the comprehensive
    # weekly + manual scans). CI-minutes sweep.
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
      - name: Scan Dockerfiles / compose for misconfig
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: '**/node_modules,**/.venv,**/__pycache__,**/.next,**/.vercel,**/dist,**/build,**/.pytest_cache,**/.claude'
          # The gitleaks baseline contains REDACTED+Match fields that look
          # like leaked secrets to a secret-scanner pattern matcher; it's
          # the documented record of known-clean findings, not a leak.
          skip-files: '.gitleaks-baseline.json'
          # See .trivyignore for justified suppressions (currently DS-0002
          # on backup / gpu-exporter / voice-agent / auto-embed images
          # that legitimately need root for bind-mount or driver access).
          trivyignores: '.trivyignore'

  action-pins:
    name: Lint third-party Actions for SHA pins
    # CI_RUNNER seam (see docs/operations/self-hosted-ci-runner.md): runs on the
    # self-hosted fleet when the repo variable is set, else ubuntu-latest. The
    # variable is unset on the public mirror and on forks, so this is hosted
    # there by construction. Seam-safe: no services:/container:/docker.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: changes
    # Only when workflow files change (or the comprehensive scans). CI-minutes sweep.
    if: ${{ needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # Defends against the floating-tag supply-chain vector.
    # Fails the build if any `uses:` in .github/workflows/ points at a
    # tag/branch instead of a 40-char commit SHA. Pure-stdlib script —
    # no pip install needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
      - name: Run check-action-pins
        run: python3 scripts/ci/check-action-pins.py
      # Same trigger + same inputs (only .github/workflows/), so it rides
      # along here rather than paying for a second checkout in its own job.
      - name: Run ci-runner-seam lint
        run: python3 scripts/ci/ci_runner_seam_lint.py

  shell-line-endings:
    name: Lint shell + PowerShell scripts
    # CI_RUNNER seam (see docs/operations/self-hosted-ci-runner.md): runs on the
    # self-hosted fleet when the repo variable is set, else ubuntu-latest. The
    # variable is unset on the public mirror and on forks, so this is hosted
    # there by construction. Seam-safe: no services:/container:/docker.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: changes
    # Only when shell scripts change (or the comprehensive scans). CI-minutes sweep.
    if: ${{ needs.changes.outputs.shell == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # Regression gate for the DbBackupJob `set: pipefail: invalid opt`
    # crash. ``.gitattributes`` normalizes ``*.sh`` to ``eol=lf`` on
    # fresh checkouts, but a contributor on Windows can re-introduce
    # CRLF (editor save-as, ``git config core.autocrlf=true`` in a
    # personal global), and the worker bind-mounts ``./scripts`` into
    # the container -- CRLF bytes there crash bash on ``set -euo
    # pipefail``. Fails the build the moment any tracked
    # ``*.sh`` / ``*.bash`` file carries ``\r``. Pure-stdlib script.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
      - name: Run check-shell-line-endings
        run: python3 scripts/ci/check-shell-line-endings.py
      # Companion gate: PowerShell scripts must be ASCII or UTF-8-with-BOM.
      # Windows PowerShell 5.1 decodes BOM-less ``.ps1`` as ANSI, turning
      # multi-byte UTF-8 chars (e.g. em-dash) into string-delimiter
      # smart-quotes -- the script then fails to parse before it runs.
      - name: Run check-powershell-encoding
        run: python3 scripts/ci/check-powershell-encoding.py

  poetry-lock:
    name: poetry check --lock (src/cofounder_agent)
    # CI_RUNNER seam (see docs/operations/self-hosted-ci-runner.md): runs on the
    # self-hosted fleet when the repo variable is set, else ubuntu-latest. The
    # variable is unset on the public mirror and on forks, so this is hosted
    # there by construction. Seam-safe: no services:/container:/docker.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    needs: changes
    # Only when pyproject.toml / poetry.lock change (or the comprehensive scans). CI-minutes sweep.
    if: ${{ needs.changes.outputs.pylock == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # GH#180 defense-in-depth — the same check runs locally as a pre-commit
    # hook (.pre-commit-config.yaml) AND in the test workflow on Gitea
    # (.gitea/workflows/ci.yml). Mirroring it here protects the public
    # GitHub mirror in case a contributor opens a PR without pre-commit
    # installed and without going through Gitea CI first.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install "poetry==2.2.1"
      - name: Verify poetry.lock matches pyproject.toml
        run: |
          cd src/cofounder_agent
          poetry check --lock

  sbom:
    name: SBOM + grype scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Schedule/dispatch only. Grype is entirely redundant with trivy-fs on
    # per-PR/push events and is the most expensive job (~3–5 min). The weekly
    # scheduled run covers dep-drift CVEs between pushes. CI-minutes sweep.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.0 as of 2026-05-12
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-cyclonedx

      - name: Scan SBOM with grype (HIGH/CRITICAL gate)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v5.3.0 as of 2026-05-12
        id: grype-scan
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          # Mirror trivy-fs's `ignore-unfixed: true`. Without this the two
          # gates disagree: trivy stays green on a CVE with no upstream patch
          # while grype fails the build on it, so the weekly run can sit red
          # on something nobody can action. A gate that cannot be satisfied
          # stops being read — which is precisely how this workflow went
          # unnoticed for seven weeks (see the notify job below).
          only-fixed: true
          output-format: sarif

      - name: Upload grype SARIF
        # Same GHAS gating as trivy-fs above — private repo can't accept
        # SARIF; public mirror can.
        if: always() && steps.grype-scan.outputs.sarif != '' && github.repository == 'Glad-Labs/poindexter'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v3.35.4 as of 2026-05-12
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype-sbom

  # ------------------------------------------------------------------------
  # Weekly-baseline visibility.
  #
  # The scans above ALREADY run unfiltered on the weekly `schedule` (the
  # `|| schedule || workflow_dispatch` escapes on each job's `if:`) — the
  # scheduled sweep was never the missing piece. What was missing is anyone
  # finding out when it fails. A red PR run is visible to whoever pushed it;
  # a red *scheduled* run is addressed to nobody, and the run summary is the
  # only record that it happened at all.
  #
  # Measured cost of that gap: the weekly baseline failed SEVEN consecutive
  # weeks — 2026-06-22 through 2026-08-03 — on `SBOM + grype scan`, and
  # nobody noticed until someone went looking for an unrelated reason. This
  # is the same shape as the `benchmarks` regression written up in
  # scripts/ci/ci_runner_seam_lint.py ("failing its nightly run for weeks —
  # invisible because it gates nothing"). A scan nobody reads is not a gate,
  # so the delivery is part of the control, not a nicety.
  #
  # Routine ops signal → Discord. Telegram stays reserved for wake-me-up
  # critical, and a dependency CVE on main is a this-week problem, not a
  # right-now one.
  # ------------------------------------------------------------------------
  notify-baseline:
    name: Weekly baseline → Discord when red
    # Plain hosted runner, matching trivy-fs / sbom above. Deliberately NOT on
    # the vars.CI_RUNNER seam: this step shells out to python3, and the
    # self-hosted runner image ships no `python` (see the PyYAML note in
    # scripts/ci/ci_runner_seam_lint.py). It bills one rounded-up minute a
    # week.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` is load-bearing — the implicit `success()` gate would skip
    # this job in exactly the case it exists to report. Restricted to
    # schedule/dispatch because push and pull_request failures are already
    # attributable to a person who is watching that run.
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      - gitleaks
      - trivy-fs
      - trivy-config
      - action-pins
      - shell-line-endings
      - poetry-lock
      - sbom
    steps:
      - name: Report failed scans to Discord
        # The `secrets` context is not allowed in a job-level `if:` (GitHub
        # rejects it at parse time), so the webhook is surfaced as env and
        # gated here at step level — same idiom as console-contract-drift.yml.
        # An absent secret is a quiet skip rather than a red job, which is
        # what the public poindexter mirror gets.
        if: ${{ env.DISCORD_OPS_WEBHOOK_URL != '' && contains(needs.*.result, 'failure') }}
        shell: bash
        env:
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_TRIVY_FS: ${{ needs.trivy-fs.result }}
          R_TRIVY_CONFIG: ${{ needs.trivy-config.result }}
          R_ACTION_PINS: ${{ needs.action-pins.result }}
          R_SHELL: ${{ needs.shell-line-endings.result }}
          R_POETRY: ${{ needs.poetry-lock.result }}
          R_SBOM: ${{ needs.sbom.result }}
        run: |
          set -euo pipefail

          # Name the jobs that actually failed — "the security workflow is
          # red" sends the reader back to the Actions tab to find out which
          # half, which is the friction that makes an alert skippable.
          failed=""
          add() {
            if [ "$1" = "failure" ]; then
              failed="${failed}"$'\n'"• $2"
            fi
          }
          add "$R_GITLEAKS"     "gitleaks — secret scan"
          add "$R_TRIVY_FS"     "Trivy — filesystem vuln scan"
          add "$R_TRIVY_CONFIG" "Trivy — Dockerfile + IaC config"
          add "$R_ACTION_PINS"  "Lint third-party Actions for SHA pins"
          add "$R_SHELL"        "Lint shell + PowerShell scripts"
          add "$R_POETRY"       "poetry check --lock (src/cofounder_agent)"
          add "$R_SBOM"         "SBOM + grype scan"

          msg="🔴 Weekly security baseline is RED — ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          msg="${msg}${failed}"$'\n\n'
          msg="${msg}These scans are path-gated on PRs and only run unfiltered here, so this is the branch's own accumulated backlog rather than any one PR's fault."$'\n'
          msg="${msg}${RUN_URL}"

          # Encode with stdlib json so newlines/quotes in the message can
          # never produce a malformed payload (repo convention: no hand-rolled
          # JSON in shell).
          python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))' <<<"$msg" > payload.json

          # A delivery failure must never turn a green scan red, nor mask a
          # red one — the scan result is the signal, this is only transport.
          curl -fsS -H 'Content-Type: application/json' --data @payload.json "$DISCORD_OPS_WEBHOOK_URL" >/dev/null || true

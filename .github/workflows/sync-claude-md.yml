# Nightly sync of source-truth stats in CLAUDE.md (file counts, dashboard
# counts) and in the root README.md (the tests badge and its two prose
# restatements). Companion to regen-app-settings-doc.yml — same
# drift-detect-then-PR pattern, different target files.
#
# Only updates stats derivable from the checked-in repo. DB-derived
# stats (post counts, embeddings totals, app_settings counts) are NOT
# touched by this job — in CLAUDE.md *or* in README.md — because those
# need a prod DB probe. sync_claude_md_db_stats.py owns them, fired
# locally by the claude-md-sync ops session, and it writes both files too.
#
# README joined the target set once its hand-typed marketing stats were
# found stale (the intro claimed 166 live posts against a real 198, the
# badge 11,400+ tests against ~17,200). README claims are floored to a
# round "N+", so this job is a no-op on all but the rare night that
# crosses a thousand.
#
# Why a separate workflow rather than extending regen-app-settings-doc:
# different cadence reasoning (these docs churn slower; rerunning on
# stat-only deltas keeps the PR signal tight) and different ownership
# (this one writes CLAUDE.md + README.md, the other only writes the
# public reference page).
name: sync-claude-md

on:
  schedule:
    # 06:17 UTC daily — offset from regen-app-settings-doc's 06:13 so
    # both don't share a scheduler slot, and from on-the-hour to avoid
    # the GitHub Actions high-contention boundaries. Brain :13 convention.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Cancel an in-progress run if a newer one starts (avoid pushing
# conflicting drift branches).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Mint a "Glad Labs Release Bot" App token — same rationale as
      # regen-app-settings-doc.yml: a PR whose head commit is pushed with
      # the default GITHUB_TOKEN never triggers the required `test-backend`
      # / `migrations-smoke` checks (GitHub's recursion guard suppresses
      # workflow triggers from GITHUB_TOKEN), so it stays BLOCKED forever.
      # Pushing as the App (a real principal) makes those checks fire and
      # the PR becomes mergeable normally. See release-please.yml.
      - name: Mint App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Resolve App bot user id (for commit authorship)
        id: app_user
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          echo "user_id=$(gh api "/users/${{ steps.app_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          # Push the drift branch as the App so the PR triggers required CI.
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0  # need history to push a drift branch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      # tee, not >: the run log keeps showing the script's output live, and
      # the saved copy carries any "WARNING: anchor not found" line into the
      # PR body. A dead anchor makes no diff by construction, so a warning
      # that only ever reached a collapsed log step would be invisible —
      # which is how the app_settings count froze in the first place (#2832).
      # `shell: bash` is load-bearing, not decoration: the default runner
      # shell is `bash -e` WITHOUT pipefail, so a crashed script piped into
      # tee would exit 0 and read as "nothing to sync". That exact shape
      # froze the DB counts for a month (stack#2408).
      - name: Run sync (writes CLAUDE.md + README.md if drift)
        shell: bash
        run: python scripts/sync-claude-md-stats.py | tee /tmp/sync-output.txt

      - name: Detect drift
        id: drift
        run: |
          if [[ -z "$(git status --porcelain CLAUDE.md README.md)" ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE.md + README.md are in sync — nothing to PR."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected — opening PR."
            git diff --stat CLAUDE.md README.md
          fi

      - name: Open / update PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/claude-md-sync-${DATE}"

          # Commit + push as the App bot so the PR's head commit is the
          # App's (a real principal) and the required checks actually fire.
          git config user.name "${{ steps.app_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app_user.outputs.user_id }}+${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # Stable branch per day — re-running on the same day amends the
          # existing PR instead of opening a duplicate.
          git checkout -B "$BRANCH"
          git add CLAUDE.md README.md
          git commit -m "docs: sync source-truth stats in CLAUDE.md + README (auto)"
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH — pushed updated commit."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: sync source-truth stats (${DATE})" \
              --body "$(cat <<EOF
          ## Summary

          Auto-generated by \`.github/workflows/sync-claude-md.yml\`. Updates the
          source-truth stats in CLAUDE.md (file counts, dashboard count) and
          the repo-derived README.md claims (the tests badge and its two prose
          restatements) to match the current repo state. README numbers are
          floored to a round \`N+\`, so they move only on a threshold crossing.

          DB-derived stats (post counts, embeddings totals, app_settings
          totals) are NOT touched in either file — those need a prod DB probe,
          owned by \`scripts/sync_claude_md_db_stats.py\`.

          Script output (a \`WARNING:\` line means an anchor stopped matching and
          that claim is no longer syncing — fix the pattern, do not ignore it):
          \`\`\`
          $(cat /tmp/sync-output.txt)
          \`\`\`

          Diff:
          \`\`\`
          $(git diff HEAD~1 HEAD --stat CLAUDE.md README.md)
          \`\`\`
          EOF
          )"
          fi

          # Enable auto-merge so the PR lands as soon as CI passes.
          # allow_auto_merge=true on the repo permits this, but each PR
          # must opt in explicitly via --auto. Squash keeps linear history.
          gh pr merge --auto --squash "$BRANCH" || true

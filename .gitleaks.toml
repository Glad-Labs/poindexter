# gitleaks config — repo-local overrides on top of the bundled default rules.
# Reason this file exists: bootstrap.toml example snippets, migration docs,
# and the GlitchTip DSN format (http://<public_key>@host/<project_id>) look
# like secrets but aren't. Allowlist them here so gitleaks doesn't fire on
# our own docs.
#
# Historical findings: .gitleaks-baseline.json freezes the 336 pre-adoption
# leaks detected when this gate landed (all credentials rotated already —
# see `session_52_polish.md`). CI passes the baseline so only NEW leaks
# fail the gate. Do not remove the baseline without re-triaging it.

title = "Poindexter gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for paths that can't realistically contain real secrets"
paths = [
  '''(?i).*\.lock$''',
  '''(?i).*\.min\.js$''',
  '''(?i)CHANGELOG\.md$''',
  '''(?i)^brain/seed_app_settings\.json$''',
  # Grafana-provisioned dashboard JSON is public config, not secrets.
  '''(?i)^infrastructure/grafana/dashboards/.*\.json$''',
  # Test fixtures intentionally embed secret-shaped strings to exercise the
  # scrubbers, provider-key validators, and secret-storage helpers. The
  # private baseline suppresses these per-finding; adding the path here lets
  # the public repo's gitleaks pass without shipping the baseline externally.
  '''(?i)^src/cofounder_agent/tests/.*\.py$''',
  # Vendored Semgrep rulesets are, by definition, a corpus of credential
  # PATTERNS plus the example values that exercise them — a Slack webhook shape
  # and a sample private key trip gitleaks on sight. Allowlisting the directory
  # rather than the two fingerprints is deliberate: a rules refresh
  # (infrastructure/semgrep/README.md) would mint new fingerprints and turn
  # this red again for a reason that has nothing to do with the code.
  '''(?i)^infrastructure/semgrep/.*\.yaml$''',
  # Documentation examples: curl snippets, Authorization header demos,
  # placeholder bearer tokens like "YOUR_API_TOKEN" / "$TOKEN" / "dev-token".
  '''(?i)^docs/.*\.md$''',
  # 2026-05-12 — added with the --no-git CI scan rollout (poindexter#404).
  # --no-git walks the filesystem instead of git history, picking up local
  # dev artifacts that gitignore normally hides. These paths can't ship
  # secrets to the public mirror anyway (most are gitignored locally or
  # stripped by scripts/sync-to-github.sh).
  '''(?i)^\.claude/''',                              # claude-code session state
  '''(?i)\.venv/''',                                  # python venvs (anywhere in tree)
  '''(?i)node_modules/''',                           # npm deps (anywhere in tree)
  '''(?i)^\.vercel/''',                              # vercel local CLI cache
  '''(?i)^\.env(\..*)?$''',                          # .env, .env.local, .env.production.local
  '''(?i).*/\.env(\..*)?$''',                        # nested .env files
  '''(?i)^gcm-diagnose\.log$''',                     # git credential manager diagnostics
  '''__pycache__/''',                                # python bytecode (anywhere)
  '''\.pyc$''',                                       # compiled python files
  # Private surfaces — stripped from public mirror by sync-to-github.sh but
  # present locally so --no-git would scan them. Operator-only.
  '''(?i)^web/public-site/''',                       # branded Next.js site (private)
  '''(?i)^web/storefront/''',                        # Lemon Squeezy storefront (private)
  '''(?i)^mcp-server-gladlabs/''',                   # operator MCP server (private)
  # The baseline itself contains REDACTED+Match fields that look like
  # secrets to other scanners (e.g., Trivy filesystem). The baseline is
  # its own self-evident "these are known-OK findings" record.
  '''(?i)^\.gitleaks-baseline\.json$''',
]

# Specific examples gitleaks mis-flags. Keep this list tight — every entry
# is a place we've decided a string that LOOKS like a secret isn't one.
regexTarget = "line"
regexes = [
  # GlitchTip/Sentry DSNs document the public-key form in docs + docker-compose.
  '''http://[0-9a-f]{32}@[a-z0-9\-]+:\d+/\d+''',
  # bootstrap.toml example placeholders written as "<generated>" etc.
  '''<generated[^>]*>''',
  # FastAPI openapi/docs/redoc URL paths — gitleaks generic-api-key
  # entropy heuristic fires on the literal "/api/openapi.json" string
  # in `services/main.py`. They're URL paths, not secrets.
  '''/api/(openapi\.json|docs|redoc)''',
  # Docstring curl examples — operator-facing API docs include
  # `Authorization: Bearer YOUR_JWT_TOKEN` / `Bearer YOUR_API_TOKEN`
  # placeholder values. They're documentation, not secrets, but
  # gitleaks's curl-auth-header rule fires anyway. The baseline-by-
  # line-number approach broke whenever a docstring shifted lines
  # (e.g. PR #595 added 43 lines above three of these examples).
  # This content-anchored allowlist survives line shifts.
  # 2026-05-26.
  '''Authorization:\s*Bearer\s+(YOUR_[A-Z_]+|<[a-z_]+>|REDACTED|placeholder|example|dev-token|\$[A-Z_]+)''',
]

# ---------------------------------------------------------------------------
# GitHub App installation tokens — stateless (JWT) format
# ---------------------------------------------------------------------------
# gitleaks' bundled `github-app-token` rule is `(ghu|ghs)_[0-9a-zA-Z]{36}`,
# which only ever matched the CLASSIC opaque token. On 2026-04-27 GitHub
# started rolling every newly-minted installation token over to a stateless
# `ghs_<APPID>_<JWT>` shape — ~520 chars, two dots, charset [A-Za-z0-9._-].
# The `_` and `.` break the bundled rule's 36-char alphanumeric run, so a
# leaked modern token scans CLEAN. Verified against the pinned gitleaks
# v8.30.1 with this exact config: classic token = 1 finding, stateless
# token = 0 findings.
#
# This is live risk, not future risk. We mint installation tokens in six
# workflows across three Apps (mirror-sync, release-please, ci-runner), and
# the rollout predates this rule by four months — so any token pasted into
# a committed log excerpt or debugging note since April has been invisible
# to both this gate and the `gitleaks protect --staged` pre-commit hook,
# which share these rules.
#
# ADDITIVE, deliberately — no `[extend] disabledRules`. Leaving the bundled
# rule enabled keeps classic-token coverage owned upstream, so a future
# gitleaks fix can't be silently undone by ours going stale. The regex
# below requires the two-dot JWT tail, which is also what stops it
# double-reporting classic tokens the bundled rule already catches.
#
# Shape follows GitHub's own guidance (`ghs_[A-Za-z0-9\.\-_]{36,}`) narrowed
# to the stateless structure. gitleaks uses Go RE2 — no lookarounds here.
[[rules]]
id = "github-app-token-stateless"
description = "GitHub App installation token (stateless ghs_APPID_JWT format)"
regex = '''ghs_[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''
keywords = ["ghs_"]

version: 2

updates:
  # ────────────────────────────────────
  # GitHub Actions (workflows)
  # ────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # npm (Node.js packages — root workspace)
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    # Held majors (2026-07-28). Both are major-ONLY holds — patches and minors
    # still flow, so security fixes are unaffected.
    #
    # typescript: 7.0.2 breaks jest-unit and the Frontend-only Playwright specs
    #   (#2869/#2846). Because dependabot puts a manifest change in the group's
    #   PR even when the group is minor/patch-only, that one major sits in
    #   front of the whole batch. Hold it until the TS 7 migration is done
    #   deliberately, then drop this entry.
    #
    #   Caveat for whoever drops it: typescript was NOT the only thing failing
    #   those two checks, despite how it looked at the time. react/react-dom
    #   19.2.8 and @tailwindcss/postcss 4.3.3 broke them independently, via a
    #   workspace hoisting bug — bumping a dep declared only in web/public-site
    #   de-hoisted it while its consumer stayed at the root node_modules. Fixed
    #   in #2886 by declaring react/react-dom/tailwindcss at the root. So a
    #   green run after dropping this hold means TS 7 itself is fine; it does
    #   not retroactively mean TS 7 was ever the sole blocker.
    #
    # @types/node: the 22 -> 26 major already landed outside dependabot, so all
    #   four manifests are on ^26.1.x today. This entry is a forward guard
    #   against an unattended 27 rather than a fix for anything open now.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Group updates by type for easier review. Restricted to minor/patch
    # (matching every other grouped ecosystem below) so a major bump rides
    # alone in its own PR instead of blocking a batch of safe updates.
    groups:
      development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # npm — web/starter (Next.js template)
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/web/starter'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:35'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      web-starter-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # npm — Cloudflare Workers page-views beacon
  # ────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/infrastructure/cloudflare/page-views-beacon'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:40'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      beacon-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Python — src/cofounder_agent (pip / Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/src/cofounder_agent'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — brain daemon (Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/brain'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:05'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — root pyproject.toml (Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:10'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — mcp-server (uv)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:15'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Python — mcp-server-gladlabs (uv, private operator overlay)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server-gladlabs'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:20'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-gladlabs-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Python — mcp-server-voice (uv)
  # ────────────────────────────────────
  - package-ecosystem: 'uv'
    directory: '/mcp-server-voice'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:25'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'
    groups:
      mcp-server-voice-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # ────────────────────────────────────
  # Docker (base images)
  # ────────────────────────────────────
  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:30'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'ci:'

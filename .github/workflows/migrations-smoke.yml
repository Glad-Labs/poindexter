# Smoke-test that every migration in src/cofounder_agent/services/migrations/
# applies cleanly against an empty Postgres 16 + pgvector database.
# Catches "migration N silently dropped a column migration M depended on"
# regressions before they hit a real restart. (GH#229)
name: migrations-smoke

on:
  # Fire on every push to main and every PR — branch protection requires
  # this status check, so it has to report on every PR (a path-filtered
  # workflow that doesn't fire would block the PR forever). The job
  # itself runs ~30s on a cache-warm runner, so the trade-off is fine.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older in-progress runs of the same ref/PR — saves Actions minutes
# when multiple commits land back-to-back on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege GITHUB_TOKEN — read-only checkout is all this workflow
# needs. Bump per-job if a step ever needs write access (none does today).
permissions:
  contents: read

jobs:
  migrations-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poindexter_test
        ports:
          - 5432:5432
        # Health-check ensures the runner waits until pg_isready before the
        # job step starts — matches the canonical actions/example pattern.
        options: >-
          --health-cmd "pg_isready -U postgres -d poindexter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/poindexter_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5.6.0 as of 2026-05-12
        with:
          python-version: "3.13"

      # The runner only needs asyncpg + the project's own migration files.
      # Avoid a full poetry install (300+ deps, ~2 min) — keeps this job fast.
      - name: Install runtime deps
        run: pip install "asyncpg>=0.30,<0.32"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            echo "waiting for postgres... ($i)"
            sleep 1
          done
          echo "postgres never became ready" >&2
          exit 1

      # Lint runs first — cheaper than the smoke test and catches the
      # convention drift class of bug (collisions, missing interface,
      # invalid filename) before we even touch Postgres. Glad-Labs/poindexter#378.
      - name: Lint migration filenames + interface
        run: python scripts/ci/migrations_lint.py

      # Catches a key DELETEd by a migration but still present in a seed file
      # (baseline.seeds.sql / brain/seed_app_settings.json) — the every-boot
      # reseed would resurrect it. Static, no DB needed. (2026-06-21)
      - name: Lint settings seed/migration drift
        run: python scripts/ci/settings_seed_drift_lint.py

      # Catches the three app_settings seed sources disagreeing on a key's
      # VALUE — the gap poindexter#819 named and didn't close. First-writer-wins
      # (all three are ON CONFLICT DO NOTHING), so a disagreement silently makes
      # one value unreachable on a fresh install. settings_defaults.py and
      # baseline.seeds.sql must agree exactly; brain/seed_app_settings.json is
      # the free tier and may diverge only via a declared TIER_POLICY entry.
      # NOTE: a fold-forward baseline squash re-imports live operator values and
      # WILL red this — that's the guard working. See docs/operations/migrations.md.
      # Static, no DB needed. (2026-07-17)
      - name: Lint settings seed value drift
        run: python scripts/ci/settings_seed_value_drift_lint.py

      # Every count the CLAUDE.md sync scripts maintain rides on a prose
      # anchor; rewording the prose kills the regex and the number silently
      # freezes while still reading as current (#2820 → #2825 did exactly
      # that to the app_settings bullet). This fails the PR that breaks the
      # wording instead of leaving it to a nightly PR body nobody reads.
      # Patterns are imported from the sync scripts, so the lint can't
      # drift from them. Skips cleanly when CLAUDE.md is absent (the public
      # mirror strips it but shares this workflow). Static, no DB. (#2832)
      - name: Lint CLAUDE.md sync anchors
        run: python scripts/ci/claude_md_anchor_lint.py

      # A bare './x' compose mount resolves to the compose PROJECT dir, not
      # ${POINDEXTER_DEPLOY_ROOT}. On an operator host with a separate deploy
      # clone that means the container runs code from the working checkout and
      # merged changes never deploy — silently. It hid a broken GPU exporter
      # fix and kept merged Grafana dashboards dark on the same day
      # (poindexter#922 / #923). Static, no DB needed. (2026-07-26)
      - name: Lint compose mounts anchored to deploy root
        run: python scripts/ci/compose_mount_deploy_root_lint.py

      - name: Run migrations against empty database
        run: python scripts/ci/migrations_smoke.py

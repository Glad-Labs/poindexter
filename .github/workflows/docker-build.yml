# Build the container images that gate production.
#
# Until now NOTHING in CI built them. Three Dockerfiles decide what actually
# runs the pipeline, and the first time anyone learned a change broke the image
# was at deploy time on the operator's PC. Trivy *scans* Dockerfiles; nothing
# *built* them.
#
# That gap is not theoretical. Host and image genuinely diverge: the images
# install with `poetry install --no-root`, so no distribution metadata exists
# and `importlib.metadata.entry_points()` returns 0 inside the worker while the
# host venv reports 8 taps / 26 jobs. Host-green says less about the image than
# it looks like it does.
#
# Why `docker build --check` is NOT used here: it is a best-practice linter
# only. Measured 2026-07-30 — it reports "no warnings found" for both a
# Dockerfile syntax error AND a `COPY` of a nonexistent file. A real build
# catches the bad COPY immediately. Shipping --check would have looked like
# coverage while catching nothing.
#
# What is deliberately NOT built: image-gen (14.5 GB), chatterbox (14.1 GB),
# wan. They exceed a hosted runner's disk, and their failure mode is model
# loading at runtime rather than image assembly. Building them here would buy
# little and add a slow, flaky job — the same "permanently red advisory check"
# problem this workflow exists to help retire.
name: docker-build

# Path-filtered ON PURPOSE, and therefore NOT a required check. A required
# check must run unconditionally or PRs hang forever on "Expected — Waiting for
# status to be reported" (see the note atop python-lint.yml). Building images
# on every docs-only PR would be pure waste, so this trades gating for cost.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
      - 'src/cofounder_agent/pyproject.toml'
      - 'src/cofounder_agent/poetry.lock'
      - 'src/cofounder_agent/poindexter/brain/pyproject.toml'
      - 'src/cofounder_agent/poindexter/brain/poetry.lock'
      - 'src/cofounder_agent/poindexter/brain/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/.dockerignore'
      - 'src/cofounder_agent/pyproject.toml'
      - 'src/cofounder_agent/poetry.lock'
      - 'src/cofounder_agent/poindexter/brain/pyproject.toml'
      - 'src/cofounder_agent/poindexter/brain/poetry.lock'
      - 'src/cofounder_agent/poindexter/brain/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # brain is small (670 MB) and pure-Python, so it builds reliably on a hosted
  # runner in about a minute. Verified building clean from a fresh checkout.
  build-brain:
    if: github.repository != 'Glad-Labs/poindexter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1
      - name: Build brain image
        run: docker build -f src/cofounder_agent/poindexter/brain/Dockerfile -t poindexter-brain:ci ./src/cofounder_agent
      # The image copies only poindexter/brain/, so a module that imports worker
      # code fails HERE and nowhere else -- the unit suite runs from the full
      # worktree and cannot notice. Imports every brain module inside the image.
      - name: Import smoke inside the brain image
        run: |
          # brain_daemon resolves its DSN at import (fail-loud exit 2 without one);
          # the dummy DSN is never dialed at import time.
          docker run --rm -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:1/smoke \
            --entrypoint python poindexter-brain:ci -c '
          import importlib, pkgutil, sys
          import poindexter.brain as b
          mods = [m.name for m in pkgutil.iter_modules(b.__path__, "poindexter.brain.") if not m.ispkg]
          bad = []
          for name in mods:
              try:
                  importlib.import_module(name)
              except BaseException as exc:
                  bad.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"{len(mods)} brain modules imported in the image, {len(bad)} failed")
          print("\n".join(bad))
          sys.exit(1 if bad or len(mods) < 20 else 0)
          '
      - name: Report size
        run: |
          docker images poindexter-brain:ci --format 'brain image size: {{.Size}}'

  # The two pure-Python sidecars build hosted in about a minute each and are
  # built here for the same reason the brain is: an image no job builds rots
  # invisibly. Step 2 of poindexter#1046 moved brain/ under poindexter/ and left
  # `chown -R … /brain` behind in three sidecar Dockerfiles; nothing in CI built
  # them, so the break surfaced only as a prod deploy pass failing every ten
  # minutes ("chown: cannot access '/brain'") until someone read the deploy log.
  # The smoke imports through the image's own entry surface (the plugin registry
  # for auto-embed, the exporter script for gpu-exporter) because a COPY that
  # ships the wrong tree still builds green. voice-bot is deliberately not built
  # here: its pytorch base is a multi-GB pull for a feature that is parked.
  build-sidecars:
    if: github.repository != 'Glad-Labs/poindexter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [auto-embed, gpu-exporter]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1
      - name: Build ${{ matrix.image }} image
        run: docker build -f scripts/Dockerfile.${{ matrix.image }} -t poindexter-${{ matrix.image }}:ci .
      - name: Import smoke inside the image
        run: |
          case "${{ matrix.image }}" in
            auto-embed)
              docker run --rm --entrypoint python -e DATABASE_URL=postgresql://x:y@localhost:1/z \
                poindexter-auto-embed:ci -c '
          import sys
          from poindexter.plugins.registry import get_core_samples, get_taps
          taps = get_taps(); samples = get_core_samples()
          flat = [k for k in sys.modules if k.split(".")[0] in {"services", "plugins", "modules", "utils", "brain", "schemas"}]
          assert taps, "no taps registered inside the sidecar"
          assert not flat, f"flat module keys inside the sidecar: {flat[:5]}"
          print(f"auto-embed: {len(samples)} core samples, {len(taps)} taps, 0 flat keys")
          ' ;;
            gpu-exporter)
              docker run --rm --entrypoint python poindexter-gpu-exporter:ci -c '
          import ast
          ast.parse(open("/app/nvidia-smi-exporter.py").read())
          import asyncpg
          print("gpu-exporter: script parses, asyncpg importable")
          ' ;;
          esac
      - name: Report size
        run: |
          docker images poindexter-${{ matrix.image }}:ci --format '${{ matrix.image }} image size: {{.Size}}'

  # The worker is THE image that runs the content pipeline, and the one worth
  # guarding. It is ~7.6 GB and its `poetry install` pulls multi-GB wheels
  # (torch, playwright) — and it still builds HOSTED, on purpose.
  #
  # Do not "optimize" this job onto the shared `vars.CI_RUNNER` seam. That
  # shipped once (#2920) and put a red on every main push the moment the
  # runner fleet came online: the self-hosted runners are containers that
  # deliberately do NOT mount /var/run/docker.sock (they execute raw PR code —
  # unit-tests runs `poetry install` on dependabot branches — so handing them
  # the daemon that runs the production stack would let one compromised
  # dependency own the host; see the SECURITY note on github-runner-1 in
  # docker-compose.local.yml). Every `docker build` there dies with "Cannot
  # connect to the Docker daemon". The job only looked green pre-merge because
  # the fleet happened to be offline that evening, so runner-healthcheck had
  # failed CI_RUNNER over to hosted.
  #
  # Hosted is measured-fine, not hoped-fine: the cold build ran green five for
  # five at ~3 minutes each (2026-07-30/31) — the hosted runners' pipe makes
  # the multi-GB wheel pulls a non-event, and the 7.6 GB image fits hosted
  # disk. If the image ever outgrows that, the fix is a separately provisioned
  # docker-capable runner class behind CI_RUNNER_DOCKER below — never the
  # pytest runners (label-superset gotcha and the full recipe:
  # docs/operations/self-hosted-ci-runner.md, "Extending to another workflow").
  build-worker:
    if: github.repository != 'Glad-Labs/poindexter'
    # CI_RUNNER_DOCKER is a dormant seam: unset everywhere today (and on
    # forks), so this resolves to ubuntu-latest. Only ever point it at a
    # runner class whose runners DO mount docker.sock — setting it to the
    # pytest runners' labels recreates the outage documented above.
    runs-on: ${{ vars.CI_RUNNER_DOCKER && fromJSON(vars.CI_RUNNER_DOCKER) || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1 as of 2026-05-12
        with:
          fetch-depth: 1
      - name: Build worker image
        run: |
          docker build \
            -f src/cofounder_agent/Dockerfile.worker \
            -t poindexter-worker:ci \
            ./src/cofounder_agent
      - name: Report size
        run: |
          docker images poindexter-worker:ci --format 'worker image size: {{.Size}}'
      - name: Prune the CI tag (keep layer cache, drop the tag)
        if: always()
        run: docker rmi poindexter-worker:ci || true

# Trivy structured ignore rules — preferred over .trivyignore for the
# `misconfigurations` section. Trivy 0.69.x parses this directly.
#
# Each entry should explain WHY the finding is acceptable. Adding to this
# file means we're choosing not to fix; new files of the same kind still
# get scanned because suppressions are path-scoped, not blanket.

misconfigurations:
  # DS-0002 — "Specify at least 1 USER command in Dockerfile"
  #
  # These three are local-only utility containers running on Matt's PC
  # behind a Tailscale tunnel — no internet exposure, no multi-tenant
  # surface, no attacker-reachable network from inside the docker-compose
  # network. Two of them (gpu-exporter, voice-bot) need device access
  # (/dev/nvidia*, ALSA) that's awkward to acquire as a non-root user.
  # The auto-embed worker doesn't strictly need root, but adding USER
  # would be a separate behavioral change worth its own commit.
  #
  # Re-evaluate if any of these grow inbound network exposure.
  - id: DS-0002
    paths:
      - "scripts/Dockerfile.auto-embed"
      - "scripts/Dockerfile.gpu-exporter"
      - "scripts/Dockerfile.voice-bot"

vulnerabilities:
  # CVE-2026-112940 / GHSA-v4x8-3wr5-3wq8 — filelock ReadWriteLock lets
  # SQLite reopen its lock database by name (symlink / journal swap).
  #
  # Fixed only in filelock 4.2.1, and litellm (every release through
  # 1.106.5) declares `filelock<4.0`, so the backend lock cannot reach the
  # fix. Not reachable here: nothing in this repo or in the backend's
  # installed packages uses ReadWriteLock (checked 2026-10-28), and the
  # attack needs a local user with rename rights in the lock's directory.
  # mcp-server-voice is on 4.2.4 and stays scanned.
  #
  # Remove when litellm allows filelock 4 (then `poetry update filelock
  # --lock`). The expiry forces a re-check even if nobody remembers.
  - id: CVE-2026-112940
    paths:
      - "src/cofounder_agent/poetry.lock"
    expired_at: 2027-01-31
    statement: "unreachable (no ReadWriteLock use); fix blocked by litellm filelock<4.0"

  # CVE-2026-114605 / GHSA-45c3-73f7-pv4m — dnspython 2.8.0 in the brain
  # lock is its python<3.13 branch only (2.9.0 needs 3.11+, the brain
  # declares a 3.10 floor). The brain image runs Python 3.14 and resolves
  # 2.9.0. Remove when the brain's python floor moves to 3.13.
  - id: CVE-2026-114605
    paths:
      - "src/cofounder_agent/poindexter/brain/poetry.lock"
    expired_at: 2027-01-31
    statement: "unused branch; the brain image (py3.14) installs dnspython 2.9.0"

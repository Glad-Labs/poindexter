-- Sensor strip — 8.8" 1920x480 (HDMI-A-1, logical position 0,1344 rotate270).
-- X11-only conky build: runs as an Xwayland client, placed by absolute coords.
conky.config = {
    update_interval = 1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    override_utf8_locale = true,

    own_window = true,
    own_window_type = 'override',
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_colour = '0b1116',

    alignment = 'top_left',
    -- Static fallback offsets (strip vs primary as of 2026-07-24).
    -- launch-strip.sh recomputes these per boot and overrides via -x/-y.
    gap_x = -1920,
    gap_y = 1344,
    border_inner_margin = 0,
    border_outer_margin = 0,
    minimum_width = 1920,
    minimum_height = 480,
    maximum_width = 1920,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=16',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    default_color = 'c8d3dc',
}

conky.text = [[${execpi 1 ~/.config/conky/strip.sh}${voffset 4}${goto 28}${cpugraph cpu0 64,440 00e5d6 ff8000 -t}${goto 512}${execgraph "cat /run/user/1000/strip-gpu0" 64,440 00e5d6 ff8000 100 -t}${goto 992}${execgraph "cat /run/user/1000/strip-gpu1" 64,440 00e5d6 ff8000 100 -t}${goto 1464}${execgraph "cat /run/user/1000/strip-watts" 64,440 00e5d6 ff8000 750 -t}]]

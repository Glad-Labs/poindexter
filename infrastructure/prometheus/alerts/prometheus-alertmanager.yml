# Prometheus + Alertmanager self-monitoring alerts.
# Closes poindexter#649 — without the prometheus + alertmanager scrape jobs
# these rules could never fire. The scrape jobs were added to prometheus.yml
# in the same commit.
#
# Key failure modes we're now catching:
#   - Alertmanager unreachable   → alerts are queued but never routed
#   - Rule evaluation errors      → alerts may silently stop firing
#   - Notification send failures  → Telegram/Discord never gets the page
#
# All evaluated on the 30s group interval so they don't lag behind the
# infrastructure.yml rules that share the same group cadence.

groups:
  - name: poindexter-prometheus
    interval: 30s
    rules:

      # Prometheus can't scrape itself — almost certainly means the
      # prometheus container restarted or TSDB is corrupt.
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Prometheus cannot scrape itself"
          description: |
            The prometheus self-scrape job has been failing for 2+ minutes.
            All other scrape jobs + alerting are likely broken too.
            Check: `docker logs poindexter-prometheus --tail 50`

      # Alertmanager unreachable — alerts fire in Prometheus but routing
      # to Telegram/Discord is silently broken.
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Alertmanager is unreachable — alert routing is broken"
          description: |
            Prometheus cannot scrape Alertmanager for 2+ minutes.
            All fired alerts are queued internally but never routed.
            Check: `docker logs poindexter-alertmanager --tail 50`

      # Rule evaluation errors — Prometheus is evaluating alert rules but
      # one or more rules are failing (bad PromQL, missing label, etc.).
      # Even a single persistent failure means affected alerts can't fire.
      - alert: PrometheusRuleEvaluationErrors
        expr: rate(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Prometheus rule evaluation errors detected"
          description: |
            {{ $value | humanize }} rule evaluation failures/s over the last 5 min.
            One or more alert rules contain bad PromQL or reference missing
            metrics. Check Prometheus UI → Status → Rules for the failing group.

      # Config reload failing — rendered rule changes (RenderPrometheusRulesJob
      # writes rules/dynamic.yml then POSTs /-/reload) sit on disk but never
      # take effect. Observed 2026-07-11: a deploy sync replaced prometheus.yml
      # on the host, the container's single-file bind mount went stale (open
      # /etc/prometheus/prometheus.yml: no such file or directory inside the
      # container), and every reload 500'd for ~100 minutes with no alert
      # anywhere. The gauge flips to 0 on the first failed attempt and holds
      # until a reload succeeds. Static (not DB-rendered) on purpose: the
      # failure mode is "rendered rule changes don't take effect", so this
      # alert must not depend on that pipeline.
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 10m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Prometheus config reload is failing — rendered rule changes are not live"
          description: |
            The last prometheus.yml/rules reload attempt failed and has not
            recovered for 10+ minutes. Rule updates rendered by
            RenderPrometheusRulesJob are written to disk but NOT being served.
            Most common cause on Windows/Docker Desktop: the host
            prometheus.yml was replaced (deploy-checkout sync) and the
            container's single-file bind mount went stale — the container
            log shows "no such file or directory" for prometheus.yml.
            Fix: `docker restart poindexter-prometheus`, then confirm
            prometheus_config_last_reload_successful == 1.

      # Alertmanager notification failures — routes are reachable but sends
      # are failing (bad webhook URL, Telegram bot token revoked, etc.).
      #
      # delivery_plane label (2026-07-25 alarm audit): this rule watches the
      # worker-webhook path — the front door for every other alert — so it
      # must not deliver THROUGH that path. During the 2026-07-23 webhook
      # outage (67 failed sends) it fired but only reached the operator
      # after the webhook recovered. The label routes it via Alertmanager's
      # native Telegram receiver instead (same out-of-band posture as
      # BrainDeliveryDeadMansSwitch; see alertmanager.yml.tmpl). Trade-off,
      # accepted: no alert_events audit row for this one alert — the row
      # write rides the exact path being reported broken. A failing-telegram
      # failure mode can still self-mask, but that arm has no independent
      # channel left to borrow.
      - alert: AlertmanagerNotificationErrors
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          category: infrastructure
          delivery_plane: dead_mans_switch
        annotations:
          summary: "Alertmanager notification send failures"
          description: |
            {{ $value }} failed notification attempt(s) in the last 5 min.
            Alerts are routing but receiver delivery is failing.
            Check: Alertmanager UI → Status for the failing receiver config.
            (Delivered out-of-band via the dead-man's-switch Telegram
            receiver — the worker-webhook path this alert reports on may
            be the thing that's broken.)

# Self-hosted stand-in for GitHub code scanning.
#
# GitHub code scanning is DISABLED on every Glad-Labs private repo by an
# org-level security configuration ("Private Repos", id 246930) — the
# repo-level toggle returns 422, and enabling it bills per active committer.
# The public mirror sits on a different configuration with everything on, which
# is exactly why the gap went unnoticed for 70 days: the half of the tree you
# can see is scanned, the half you cannot is not.
#
# And the private half is the half that matters. scripts/sync-to-github.sh
# strips modules/finance/, operator_overrides.py, operator_leak_patterns.py and
# the sessions tap, so the mirror's CodeQL has never seen them either. Until
# this job, that code was scanned by nothing at all.
#
# Rules are VENDORED under infrastructure/semgrep/ (see the README there), so
# this makes no call to the Semgrep registry and a registry outage cannot
# redden the build.
name: semgrep

# NOTE: deliberately NO `paths:` filter. A path-filtered job can never be added
# to the required checks — it does not report on PRs outside those paths and
# leaves them pending forever (reference_required_check_paths_filter_hang).
# The scan takes ~15s, so running it on every PR costs nothing and keeps this
# promotable to a required check once it has a few days of history.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semgrep:
    # PINNED to ubuntu-latest — this job must NOT use the CI_RUNNER seam.
    #
    # The self-hosted fleet runs inside myoung34/github-runner, whose base is
    # Ubuntu 20.04 (glibc 2.31). Semgrep only publishes a manylinux_2_34 wheel
    # (glibc >= 2.34), so pip on that container correctly rejects the wheel and
    # silently falls back to the sdist — which does NOT bundle `semgrep-core`.
    # The scan then dies with "Failed to find semgrep-core in PATH". The host
    # is glibc 2.39; it is the runner CONTAINER that is old, so bumping that
    # image is the prerequisite for ever moving this onto the fleet.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # only used by the notify step below, on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.13"

      # --only-binary so a platform mismatch fails HERE with a clear message,
      # instead of installing a core-less sdist that dies later looking like a
      # code problem. The pin matches the vendored rulesets' fetch date; bump
      # both together (infrastructure/semgrep/README.md).
      - name: Install semgrep (pinned, wheel only)
        run: |
          pip install --only-binary=:all: "semgrep==1.175.0"

      - name: Verify semgrep-core is present
        run: |
          semgrep --version
          python -c "import shutil,sys; sys.exit(0 if shutil.which('semgrep') else 1)"

      - name: Semgrep ratchet (no new findings, incl. the stripped overlay)
        run: python scripts/ci/semgrep_lint.py

      # main-only: this job does not gate merges yet, and a non-gating job that
      # goes red unnoticed is the exact failure this whole workstream exists to
      # fix. Filing an issue is what makes a red here visible — same pattern as
      # unit-tests.yml's lint-main guard.
      - name: Notify operator — main fails the semgrep ratchet
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ main fails the semgrep ratchet (run ${{ github.run_id }})" \
            --label "bug" \
            --body "A NEW semgrep finding reached \`main\`.

          **Run:** ${RUN_URL}
          **Commit:** \`${{ github.sha }}\`

          This ratchet is the only scanner covering the operator overlay — GitHub code scanning is disabled on the private repos, and the mirror's CodeQL cannot see the stripped files. So a regression here is genuinely unwatched elsewhere.

          Semgrep has no project context, so most findings are false positives. **Read the flagged line before acting:**

          1. Genuinely unsafe → fix the code.
          2. The sanctioned pattern (hardcoded SQL identifier + asyncpg bind params, a log message that merely mentions login) → re-baseline with \`python scripts/ci/semgrep_lint.py --update-baseline\` and say why in the commit message.

          _Auto-filed by the semgrep ratchet guard._" || true

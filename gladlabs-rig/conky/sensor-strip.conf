-- Sensor strip — 8.8" 1920x480 (rotate270). Connector name is not stable:
-- it moved HDMI-A-1 (AMD iGPU) -> HDMI-A-2 (RTX 5090) on 2026-08-06, so
-- launch-strip.sh finds the panel by its 1920x480 mode, not by name.
-- X11-only conky build: runs as an Xwayland client, placed by absolute coords.
conky.config = {
    update_interval = 1,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    override_utf8_locale = true,

    own_window = true,
    own_window_type = 'override',
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_colour = '0b1116',

    alignment = 'top_left',
    -- Static fallback offsets (strip vs primary as of 2026-07-24).
    -- launch-strip.sh recomputes these per boot and overrides via -x/-y.
    gap_x = -1920,
    gap_y = 1344,
    border_inner_margin = 0,
    border_outer_margin = 0,
    minimum_width = 1920,
    minimum_height = 480,
    maximum_width = 1920,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=16',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    default_color = 'c8d3dc',
}

-- voffset 75 puts the 54px graphs at y402-456, centred in the wells
-- make-strip-bg.py bakes at y398-460. It is calibrated against the footer row
-- rendering on ONE line: the footer's last column ends at x=1909, only 11px
-- clear of the 1920 edge, so a wider live value (net throughput, loadavg)
-- wraps it and shoves the graphs a line lower. See README.
conky.text = [[${execpi 1 ~/.config/conky/strip.sh}${voffset 75}${goto 28}${cpugraph cpu0 54,440 00e5d6 ff8000 -t}${goto 512}${execgraph "cat /run/user/1000/strip-gpu0" 54,440 00e5d6 ff8000 100 -t}${goto 992}${execgraph "cat /run/user/1000/strip-gpu1" 54,440 00e5d6 ff8000 100 -t}${goto 1464}${execgraph "cat /run/user/1000/strip-watts" 54,440 00e5d6 ff8000 100 -t}]]

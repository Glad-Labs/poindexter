[tool.poetry]
# Standalone dependency set for the Poindexter brain daemon's image.
#
# Why a separate pyproject.toml from src/cofounder_agent?
# -------------------------------------------------------
# The brain is intentionally isolated from the worker (FastAPI / cofounder
# agent) so that a broken worker venv or pyproject can never take the
# watchdog down with it. The same reasoning applies to dependency management.
#
# Operationally, the `brain-daemon` image builds from the `src/cofounder_agent`
# context (docker-compose.local.yml, docker-compose.consumer.yml and
# .github/workflows/docker-build.yml), because the brain is the
# `poindexter.brain` package and its Dockerfile copies `poindexter/__init__.py`
# beside `poindexter/brain/`. That context holds the whole worker tree, so the
# isolation lives in the Dockerfile, not the context: it installs from this
# pyproject + lockfile, never the worker's, and copies only
# `poindexter/__init__.py` and `poindexter/brain/` into the image.
#
# A small, self-contained pyproject + lockfile keeps:
#   - the dep set lockable + auditable (closes Glad-Labs/poindexter#173)
#   - the brain image small (only what it actually imports)
#   - the boundary explicit (brain != worker)
name = "poindexter-brain"
version = "0.151.1"
description = "Poindexter brain daemon — standalone monitor, self-healer, knowledge graph supervisor."
authors = ["Glad Labs LLC <hello@gladlabs.io>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"

# Database — required. Brain reads/writes Postgres directly via asyncpg
# (no SQLAlchemy, no ORM). Pin matches src/cofounder_agent/pyproject.toml
# so the two containers stay on the same client.
asyncpg = "^0.31"

# HTTP client — used by operator_url_probe.py to hit operator-facing URLs
# (Grafana dashboards, Tailscale-routed services, app_settings *_url keys).
# Without this the probe silently degrades to "httpx dependency missing"
# for every target. Matches the worker's httpx pin.
httpx = "^0.28"

# YAML parser — used by compose_drift_probe.py (#213) to read
# docker-compose.local.yml. Without this the probe silently degrades
# to "PyYAML missing — skipping" instead of actually checking drift.
pyyaml = "^6.0"

# DNS client — used by operator_url_probe.py to resolve tailnet (MagicDNS)
# names through the tailnet's resolver (Tailscale's 100.100.100.100). The
# container's public resolvers answer a *.ts.net name with the Funnel
# ingress, so without this every MagicDNS operator link probes as dead.
# Missing, the probe reports each tailnet URL as unresolvable (loud), and
# every other URL is probed as before. Same major the worker locks.
dnspython = "^2.8"

[tool.poetry.group.tracing]
# Optional OpenTelemetry stack for brain spans -> Tempo. brain/health_probes.py
# imports these inside a try/except and falls back to no-op tracers when the
# SDK is missing, so the brain still boots without this group. Install with
# `poetry install --with tracing` to enable.
optional = true

[tool.poetry.group.tracing.dependencies]
opentelemetry-api = ">=1.33,<2"
opentelemetry-sdk = ">=1.33,<2"
opentelemetry-exporter-otlp-proto-grpc = ">=1.33,<2"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

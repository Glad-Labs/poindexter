# /etc/systemd/oomd.conf — host userspace OOM killer (2026-08-27).
#
# SwapUsedLimit is the ONLY knob that mattered for the incident this exists to
# prevent: when system swap crosses it, systemd-oomd kills the descendant
# cgroup of a monitored slice using the most swap. The 2026-08-27 freeze sat
# at 99-100% swap for two days, so the 90% default trips well before the
# livelock — it is written out explicitly rather than left commented, because
# a commented default is indistinguishable from "nobody chose this".
#
# The memory-pressure knobs stay at their shipped defaults: this host's
# failure mode was swap fullness with 20 GiB of RAM still free, which the PSI
# path does not see. Do not tighten them to "also" catch this — that trades a
# real fix for false kills on ordinary render bursts.
[OOM]
SwapUsedLimit=90%

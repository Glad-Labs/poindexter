# Playwright E2E gate (glad-labs-stack#977 / poindexter#977).
#
# Before this workflow there was NO Playwright run in CI — the public
# site's e2e/ suite only ran on someone's machine, so a layout/route
# regression on www.gladlabs.io could merge green. (The Jest unit run now has
# its own CI gate — jest-unit.yml, poindexter#1290 — so it is no longer
# hook-only. JS lint remains hook-only; Vercel ignores both.)
#
# Two jobs, three lanes. The trigger picks the lane; a manual dispatch picks
# it with the `lane` input, which defaults to public-surface:
#
#   trigger                         frontend-e2e   backend-e2e
#   push / pull_request             runs           skipped
#   schedule (Mon 06:00 UTC)        skipped        public-surface lane
#   dispatch, lane=public-surface   skipped        public-surface lane
#   dispatch, lane=full             runs           full lane
#
# frontend-e2e runs the specs for statically-served Next.js pages against a
# server it boots itself: the root playwright.config.ts `webServer` block
# starts `npm run dev:public` (Next.js on :3000). Its globalSetup pings the
# backend health endpoint but TOLERATES it being down (warns + continues).
# Specs (verified: zero localhost:8000/8002 or /api/ calls):
#   - web/public-site/e2e/about.spec.ts
#   - web/public-site/e2e/legal.spec.ts
#   - web/public-site/e2e/newsletter-modal.spec.ts (opens the signup modal,
#     never submits it)
#   - web/public-site/e2e/post-detail.spec.ts
#
# backend-e2e runs against a site that is already up (SKIP_SERVER_START=true,
# so no local server is booted):
#   * public-surface lane: author.spec.ts + tag.spec.ts against production
#     (https://www.gladlabs.io), read-only. Those pages read the R2 static
#     export, not the FastAPI backend, so a hosted runner can check them.
#     To check a fix to either spec today instead of on the next Monday:
#       gh workflow run playwright-e2e.yml --repo Glad-Labs/glad-labs-stack -f lane=public-surface
#   * full lane: those two plus the six specs that call the FastAPI backend,
#     including the write-heavy manual-publish-pipeline. The backend is
#     Tailnet-only, so this lane is for an operator who has pointed the repo
#     variables PLAYWRIGHT_TEST_BASE_URL / PLAYWRIGHT_API_URL at a stack this
#     runner can reach. Its step comment says what it cannot do yet.
#   (glad-labs-stack#1291 made backend-e2e run on a schedule.)
#
# A dispatched run does not clear the brain's scheduled_workflow_watch `stale`
# finding, and should not: the probe counts event=schedule runs only, so that
# a push or a dispatch can never stand in for a cron that stopped firing
# (poindexter/brain/scheduled_workflow_watch.py). A public-surface dispatch
# tells you a fix works. The finding clears on the next green scheduled run.
#
# Third-party actions are pinned by SHA (repo convention — see
# unit-tests.yml / migrations-smoke.yml).
name: playwright-e2e

on:
  # This job is NOT a branch-protection-required check (only `test-backend`
  # and `migrations-smoke` are), so a `paths:` filter is safe here — a PR
  # that doesn't touch the frontend simply never queues this workflow and
  # nothing waits on it. (Required checks can't be path-filtered — they'd
  # never report and block the PR forever; those gate their *steps* instead.
  # See unit-tests.yml.) The frontend-only specs only exercise the
  # statically-served Next.js site, so a backend/docs/infra-only change has
  # zero chance of regressing them — skipping the ~Chromium-build run for
  # those is free savings. Glad-Labs/glad-labs-stack CI-minutes sweep.
  push:
    branches: [main]
    paths:
      - 'web/public-site/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/public-site/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-e2e.yml'
  # Weekly scheduled run: Monday 06:00 UTC — runs backend-e2e's public-surface
  # lane (read-only specs) against production (www.gladlabs.io). Not a PR
  # gate; quality signal only. Fixes Glad-Labs/glad-labs-stack#1291.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      lane:
        description: >-
          public-surface = the weekly scheduled lane, now (author + tag specs
          against www.gladlabs.io). full = all eight backend-e2e specs plus
          frontend-e2e, against vars.PLAYWRIGHT_TEST_BASE_URL /
          vars.PLAYWRIGHT_API_URL (needs a stack this runner can reach).
        type: choice
        default: public-surface
        options:
          - public-surface
          - full

concurrency:
  # event_name keeps the triggers out of each other's queue. Push, schedule
  # and dispatch all run on refs/heads/main, and a group holds one pending
  # run: a push landing while a scheduled or dispatched run waited behind
  # another would cancel it, even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend-e2e:
    name: Frontend-only Playwright specs
    # Runs on push / PR, and on a dispatch that asks for lane=full. Skipped on
    # the weekly cron and on a public-surface dispatch, which exist to run
    # backend-e2e's public-surface lane. A dispatch that re-runs that lane
    # should be the same run the cron makes: no Next.js build, and no
    # frontend failure turning the run red when the lane itself passed.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'
      # Only install + drive Chromium to keep the run lean — the
      # frontend-only specs don't need the full browser matrix in CI.
      PLAYWRIGHT_BROWSERS: chromium

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1 as of 2026-05-12

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install workspace dependencies
        # `npm ci` at the repo root installs every workspace (including
        # web/public-site) from the committed package-lock.json. Playwright
        # (@playwright/test ^1.60) is a root devDependency. Fall back to
        # `npm install` if the committed root lock has drifted (a
        # pre-existing drift, tracked separately) so this new E2E gate
        # isn't what blocks on it.
        run: npm ci || npm install

      - name: Install Playwright browsers (chromium)
        # --with-deps pulls the OS libraries chromium needs on ubuntu.
        run: npx playwright install --with-deps chromium

      - name: Build public site
        # Build once so the Next.js dev server the config boots serves the
        # real production-shaped routes the specs assert against.
        run: npm run build --workspace=web/public-site

      - name: Run frontend-only Playwright specs (chromium)
        # The root playwright.config.ts starts `npm run dev:public`
        # (Next.js :3000) via its webServer block, then runs the named
        # specs. globalSetup tolerates a missing backend, so no FastAPI
        # worker is required for these static-page specs.
        run: >
          npx playwright test
          --project=chromium
          web/public-site/e2e/about.spec.ts
          web/public-site/e2e/legal.spec.ts
          web/public-site/e2e/newsletter-modal.spec.ts
          web/public-site/e2e/post-detail.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 as of 2026-05-12
        with:
          name: playwright-report
          path: |
            test-results/playwright/html-report
            test-results/playwright/results.json
            test-results/playwright/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Specs against an already-running site — the weekly cron + manual dispatch.
  # Never a PR gate; a quality signal. The two lanes are described in the
  # header; E2E_LANE below picks one, and each lane's step sets its own target.
  # ---------------------------------------------------------------------------
  backend-e2e:
    name: Backend-dependent Playwright specs (scheduled + manual)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      # Don't boot a local Next.js server — point at an already-running site.
      SKIP_SERVER_START: 'true'
      # Only a dispatch that asks for `full` gets the full lane. The cron, and
      # a dispatch that asks for anything else (or nothing), run public-surface.
      E2E_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane == 'full' && 'full' || 'public-surface' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1 as of 2026-05-12

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install workspace dependencies
        # Fall back to npm install on pre-existing root-lock drift.
        run: npm ci || npm install

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run public-surface specs against production (scheduled + lane=public-surface)
        # The weekly cron's step, and the default dispatch's: one step, so a
        # dispatch runs the cron's exact command against the cron's exact
        # target. It renders the public prod surface (https://www.gladlabs.io)
        # — author pages + tag archives, real prod data, no writes. The target
        # is fixed here rather than read from vars, which only the full lane
        # consults. ONLY these two specs are viable from a hosted runner: the
        # backend API is Tailnet-only (never publicly exposed), so the
        # API-dependent specs (auth / integration-tests / fixtures-validation)
        # structurally cannot pass here — they sat in this list through 11
        # straight scheduled failures (2026-06-15 → 2026-08-24, 0 green ever)
        # and belong to the full lane below. Neither spec has a skip-gate, so
        # an unreachable production fails this step LOUD instead of skipping.
        # tag.spec.ts also reads the R2 post index itself, to pick the tag
        # that the most posts carry; a failure to read it fails too.
        if: ${{ env.E2E_LANE == 'public-surface' }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://www.gladlabs.io
        run: >
          npx playwright test
          --project=chromium
          web/public-site/e2e/author.spec.ts
          web/public-site/e2e/tag.spec.ts

      - name: Run full backend-dependent specs (lane=full)
        # Only a dispatch with lane=full. All eight specs, including the
        # write-heavy ones (task-workflow / manual-publish-pipeline /
        # workflow-capability), which authenticate as `Bearer dev-token` and
        # so need a backend with DEVELOPMENT_MODE=true, never production.
        # Point the repo variables PLAYWRIGHT_TEST_BASE_URL (the site) and
        # PLAYWRIGHT_API_URL (the FastAPI backend) at a stack this runner can
        # reach. Unset, as they are today, the site is production and the API
        # http://localhost:8000; the one run of this lane (2026-06-11) failed.
        # Known gap: only manual-publish-pipeline reads PLAYWRIGHT_API_URL.
        # auth / task-workflow / workflow-capability, and integration-tests /
        # fixtures-validation through fixtures.ts's APIClient, hardcode
        # http://localhost:8000, so from a hosted runner they skip or fail
        # whatever the variables say.
        if: ${{ env.E2E_LANE == 'full' }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ vars.PLAYWRIGHT_TEST_BASE_URL || 'https://www.gladlabs.io' }}
          PLAYWRIGHT_API_URL: ${{ vars.PLAYWRIGHT_API_URL }}
        run: >
          npx playwright test
          --project=chromium
          web/public-site/e2e/auth.spec.ts
          web/public-site/e2e/author.spec.ts
          web/public-site/e2e/task-workflow.spec.ts
          web/public-site/e2e/manual-publish-pipeline.spec.ts
          web/public-site/e2e/workflow-capability.spec.ts
          web/public-site/e2e/integration-tests.spec.ts
          web/public-site/e2e/fixtures-validation.spec.ts
          web/public-site/e2e/tag.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 as of 2026-05-12
        with:
          name: playwright-report-backend
          path: |
            test-results/playwright/html-report
            test-results/playwright/results.json
            test-results/playwright/junit.xml
          retention-days: 7
          if-no-files-found: ignore

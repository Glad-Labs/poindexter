      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'deps:'
      include: 'scope'
    rebase-strategy: 'auto'

  # ────────────────────────────────────
  # Python — brain daemon (Poetry)
  # ────────────────────────────────────
  - package-ecosystem: 'pip'
    directory: '/brain'
    target-branch: 'main'

# Reclaim protection for the interactive desktop — added 2026-09-15.
#
# WHY THIS EXISTS: the operator PC is also the inference host, and the desktop
# had NO reclaim protection at all (user.slice memory.low=0, memory.min=0)
# while system.slice sat at 36 GiB with ollama-primary alone holding 17 GiB.
#
# The failure it fixes, measured 2026-09-14: ollama loads a model 627x/day
# (OLLAMA_MAX_LOADED_MODELS=1, and the pipeline cycles five models of 18-22 GB
# each, so every switch is a full evict + reload). Each load pulls ~20 GB
# through the page cache. With nothing protecting user.slice, the kernel
# evicts whatever is cheapest — and an Electron window idle for 30 seconds is
# the perfect victim. Peak measured full memory stall was 73% (i.e. 73% of
# that minute NOTHING on the machine could run), swap moved 21.6 -> 45.2 GiB
# in 90 s, and refaults hit 37,000 pages/s. The desktop froze and Claude
# Desktop was repeatedly killed.
#
# WHY memory.low AND NOT memory.min: `low` is best-effort — under genuine
# pressure the kernel still reclaims past it, so this cannot cause an OOM.
# `min` is a hard guarantee and would turn a memory squeeze into a kill.
# Stability over speed: protect the desktop, never at the cost of a new
# failure mode.
#
# SIZING: user.slice measured 4.8 GiB typical / 21.9 GiB peak-since-boot on a
# 60 GiB host. 12 GiB covers the desktop + browser + Claude Desktop in normal
# use while leaving 48 GiB for the stack. Raise it only if the desktop still
# stalls; lowering it weakens the protection this exists to provide.
#
# NOTE this is NOT an oomd policy — it is kernel reclaim protection. It lives
# in this directory because this bundle is the host's memory-policy surface,
# installed together by scripts/linux/install-oomd.sh.
#
# Requires cgroup v2 with memory_recursiveprot (verify: mount | grep cgroup2),
# which makes the protection propagate to every user-<uid>.slice beneath this
# one without per-session config.
[Slice]
MemoryLow=12G

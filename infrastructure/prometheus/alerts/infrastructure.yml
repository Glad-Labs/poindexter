# Infrastructure alerts — Prometheus + Alertmanager counterparts
# of the legacy poindexter/brain/health_probes.py probes.
#
# Phase D additive-first migration (GitHub #68):
# - These rules ship alongside the existing probe loop
# - Fire into a non-production Telegram channel at first
# - After 1-2 weeks of verified parity, the brain daemon's probe loop
#   can stop running these specific checks

groups:
  - name: poindexter-infrastructure
    interval: 30s
    rules:
      # --- Worker reachability ---
      - alert: PoindexterWorkerDown
        expr: up{job="poindexter-worker"} == 0
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Poindexter worker is not reachable"
          description: |
            The worker has failed Prometheus scrapes for 2+ minutes.
            Check `docker ps` for the poindexter-worker container;
            check logs with `docker logs poindexter-worker --tail 100`.

      - alert: PoindexterWorkerUnhealthy
        expr: poindexter_worker_up == 0
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Worker reports itself unhealthy"
          description: |
            `/metrics` is reachable but `poindexter_worker_up` is 0.
            The worker is alive but something in its self-check failed.

      # --- Postgres ---
      - alert: PoindexterPostgresDown
        expr: poindexter_postgres_connected == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Worker cannot round-trip Postgres"
          description: |
            `SELECT 1` is failing from the worker. Likely the
            poindexter-postgres-local container is down or the pool
            is exhausted. Pipeline won't process tasks until fixed.

      # --- Ollama ---
      # critical since 2026-09-28; it was warning from when it was written
      # (2026-04-19). The brain's ollama_models probe is Prometheus-covered
      # (health_probes.PROMETHEUS_COVERING_RULES), so while Alertmanager is
      # healthy this rule is the ONLY notice of an Ollama outage, and warning
      # is Discord-only (alert_dispatcher._channels_for). So an unreachable
      # Ollama could not page, while "up but no models"
      # (OllamaNoModelsLoaded, critical) could.
      #
      # Measured before raising it, over Prometheus's full 15-day retention
      # (2026-09-13..28, one sample per 15 s scrape):
      #   - 23 of 85,318 samples read 0: 12 isolated single samples and two
      #     short episodes, about 1 min on 2026-09-21 and 2 min on 2026-09-26
      #     (a UPS-on-battery event). The longest unbroken run was 90 s.
      #   - The rule went pending 3 times, for 60 s at most, and never
      #     fired. `for: 3m` has 3x headroom over that, so it stays.
      #   - Renders don't zero it: 1 zero in 32.5 h of media_render, 22 in
      #     the other 323 h, and 1 in the 44 h GPU 0 ran at 80%+. So there is
      #     no GPU-busy `unless` guard: it would blind this rule during every
      #     render to filter out nothing that was measured. The 2026-06-21
      #     render timeout that OllamaNoModelsLoaded's guard answers was on
      #     the old Windows host.
      #   - For the 8 zeros the host journal still covers, Ollama's access
      #     log has no request from the worker at that moment, while the
      #     9,773 /api/tags it did log answered in under 1 ms at p99 and
      #     never over 1 s. A short zero is the worker's check failing, not
      #     Ollama, and `for:` absorbs it.
      #   - alert_events: 9 firings, all 2026-07-13..19 on the old Windows
      #     host (three alongside PoindexterHostMemoryThrashing), and none in
      #     the 71 days since, which cover all of the Linux host's time
      #     (from 2026-07-23). As critical it would have paged 0 times there.
      # Write-up: docs/operations/self-healing.md, "Which brain notices page".
      # A firefighter rule (restart_host_service, service=ollama) can hold this
      # page for a restart-then-verify: docs/operations/self-healing.md, "Host
      # services". It sets no grace, so the verify waits 600 s, which must stay
      # at least this rule's for: plus Alertmanager's group_interval
      # (test_the_alertmanager_grace_covers_a_resolved_notification_and_a_relapse).
      - alert: PoindexterOllamaDown
        expr: poindexter_ollama_reachable == 0
        for: 3m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Ollama is not reachable from the worker"
          description: |
            The worker's `/api/tags` check against Ollama (:11434) has
            failed for 3 minutes, so every LLM call routed to that instance
            (the writer and embeddings among them) is failing too. On the
            host: `systemctl status ollama-primary` and
            `journalctl -u ollama-primary -n 100` (or check whatever runs
            `ollama serve`), then `curl -s localhost:11434/api/tags`. The
            brain restarts ollama-primary through the recovery agent after
            three failed 5-minute probes, so a restart may already be under
            way. With a firefighter rule on this alert, the brain asked
            Ollama itself before this page; a "Not auto-remediated" line
            below says why it didn't restart it.

      # --- Cloudflare page-views beacon ---
      # Static (not DB-rendered): binary up/down, no tunable threshold. The
      # gauge is set out-of-band by ProbeCloudflareBeaconJob (every 5m), so
      # `for: 11m` requires ~2 consecutive failed probes before firing —
      # avoids paging on a single transient CDN blip. severity=warning →
      # Discord (analytics gap is recoverable, not a pipeline halt).
      - alert: PoindexterCloudflareBeaconDown
        expr: poindexter_cloudflare_beacon_reachable == 0
        for: 11m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Cloudflare page-views beacon Worker is unreachable"
          description: |
            ProbeCloudflareBeaconJob's health POST to the page-views beacon
            Worker hasn't returned 2xx for 11+ minutes (≥2 consecutive 5-min
            probes). First-party page-view analytics ingestion is stalled
            until it recovers. Check the Worker at dash.cloudflare.com
            (Workers & Pages → page-views-beacon) and `wrangler tail`, and
            verify the `cloudflare_beacon_url` app_setting is correct.

      # --- Affiliate /go redirect Worker ---
      # Static (not DB-rendered): binary up/down, no tunable threshold. Gauge
      # is set out-of-band by ProbeAffiliateRedirectJob (every 15m), so
      # `for: 31m` requires ~2 consecutive failed probes before firing.
      # severity=warning → Discord: revenue ATTRIBUTION stops, the site does
      # not, so this wants attention today rather than at 3am.
      - alert: PoindexterAffiliateRedirectDown
        expr: poindexter_affiliate_redirect_healthy == 0
        for: 31m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Affiliate /go redirect Worker is not resolving links"
          description: |
            ProbeAffiliateRedirectJob has failed for 31+ minutes (≥2
            consecutive 15-min probes). Every affiliate link in every
            published post is sending readers to the homepage instead of the
            merchant, and no click is being recorded — revenue attribution is
            stopped with no other error anywhere. Check
            `npx wrangler deployments list` then `wrangler versions view <id>`
            (LINKS_URL and HOME_URL must be present as SECRETS, not vars) and
            `wrangler secret list`. Runbook:
            infrastructure/cloudflare/affiliate-redirect/README.md.

      # --- Node exporter ---
      # Must be static (not DB-rendered): binary up/down, no tunable thresholds,
      # and must fire even when the DB is down (when dynamic rendering fails).
      # poindexter#705 — exporter death silently kills all disk alerting.
      # (Was WindowsExporterDown / up{job="windows"} until the Pop!_OS
      # migration's Task 5.2 swapped the host exporter to node_exporter.)
      - alert: NodeExporterDown
        expr: up{job="node"} == 0 or absent(up{job="node"})
        for: 5m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "node_exporter is unreachable — host metrics gone"
          description: |
            Prometheus cannot scrape the node_exporter target (port 9100).
            All host metrics (disk, CPU, memory) have gone stale or absent.
            PoindexterDiskSpaceLow/Critical is now blind.
            Check: `systemctl status prometheus-node-exporter`, and
            `curl -s http://localhost:9100/metrics | head` (it must be bound
            to 0.0.0.0, not 127.0.0.1, or the docker bridge can't reach it).

      # PoindexterDiskSpaceLow and PoindexterDiskSpaceCritical were here.
      # Moved to prometheus_rule_builder.py DEFAULT_RULES so operators can
      # tune the 20/10 GB free thresholds and 200 GB total-size filter via
      # app_settings (prometheus.threshold.disk_free_warning_gb etc.).

      # --- Prefect dispatch-plane containers (poindexter#710) ---
      # cAdvisor exposes container_last_seen for every running container.
      # absent() fires when the metric disappears — i.e. the container is
      # no longer running. for: 3m absorbs brief restarts so a normal
      # `docker compose restart prefect-server` won't page.
      # Container names match container_name: in docker-compose.local.yml
      # (cAdvisor on Docker Desktop exposes them without the "/" prefix).
      - alert: PrefectServerDown
        expr: absent(container_last_seen{name="poindexter-prefect-server"})
        for: 3m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Prefect server (dispatch plane) is down"
          description: |
            cAdvisor has not seen poindexter-prefect-server for 3+ minutes.
            The content dispatch plane is halted — no flow runs will be
            submitted until it recovers.
            Check: docker ps | grep prefect; docker logs poindexter-prefect-server --tail 50

      - alert: PrefectWorkerDown
        expr: absent(container_last_seen{name="poindexter-prefect-worker"})
        for: 3m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Prefect worker is down"
          description: |
            cAdvisor has not seen poindexter-prefect-worker for 3+ minutes.
            Claimed flow runs will not execute until the worker recovers.
            Check: docker ps | grep prefect; docker logs poindexter-prefect-worker --tail 50

      # --- Metrics-refresh self-monitoring (audit H2b) ---
      # refresh_metrics wraps each phase in its own try/except so one failing
      # query can't fail the whole /metrics scrape — but a failing phase leaves
      # its gauge frozen at the last value (stale), silently masking the
      # underlying problem. poindexter_metrics_refresh_errors_total counts
      # per-phase failures so a persistently stale gauge becomes visible.
      # severity=warning → Discord (degraded observability, not an outage).
      - alert: PoindexterMetricsRefreshErrors
        expr: sum by (phase) (increase(poindexter_metrics_refresh_errors_total[15m])) > 20
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "metrics_refresh phase failing: {{ $labels.phase }}"
          description: |
            The {{ $labels.phase }} phase of refresh_metrics has thrown on
            most scrapes for ~15 min, so its Prometheus gauge(s) are frozen at
            the last good value — any panel or alert reading them is stale.
            Check worker logs for `refresh_metrics: {{ $labels.phase }}`.
